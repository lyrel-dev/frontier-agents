<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1370" viewBox="0 0 1250 1370" role="img" aria-labelledby="title description">
<title id="title">03 / Target selectors and selected memberships</title>
<desc id="description">Logical ER model. Cardinalities are counts at each endpoint. EXPERIMENT_RUN (1) defines TARGET_SELECTION (0..N); EXPERIMENT_RUN (1) configures EXPERIMENT_TARGET_ACCOUNT (0..N); ACTION_EXECUTION (1) binds ACTION_TARGET_BINDING (0..N); TARGET_SELECTION (1) referenced by ACTION_TARGET_BINDING (0..N); TARGET_SELECTION (1) resolves to RESOLVED_TARGET_MEMBERSHIP (0..N); RESOURCE_IDENTITY (0..1) identifies RESOLVED_TARGET_MEMBERSHIP (0..N); TARGET_SELECTION (1) observed by TARGET_RESOLUTION_OBSERVATION (0..N)</desc>
