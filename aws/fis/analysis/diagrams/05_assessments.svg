<title id="title">05 / Workload criteria and assessment evidence</title>
<desc id="description">Logical ER model. Cardinalities are counts at each endpoint. EXPERIMENT_RUN (1) binds EXPERIMENT_METRIC_BINDING (0..N); METRIC_BINDING (1) used by EXPERIMENT_METRIC_BINDING (0..N); METRIC_BINDING (1) supplies METRIC_OBSERVATION (0..N); EXPERIMENT_RUN (1) assessed by RESILIENCE_ASSESSMENT (0..N); ASSESSMENT_CRITERION (1) evaluates RESILIENCE_ASSESSMENT (0..N); RESILIENCE_ASSESSMENT (1) cites ASSESSMENT_EVIDENCE (0..N); METRIC_OBSERVATION (1) supports ASSESSMENT_EVIDENCE (0..N)</desc>
