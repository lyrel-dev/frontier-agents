<title id="title">02 / Templates and catalog definitions</title>
<desc id="description">Logical ER model. Cardinalities are counts at each endpoint. EXPERIMENT_TEMPLATE (1) contains TEMPLATE_ACTION (1..N); EXPERIMENT_TEMPLATE (1) defines TEMPLATE_TARGET (0..N); CATALOG_ACTION (1) configures TEMPLATE_ACTION (0..N); CATALOG_ACTION (1) describes ACTION_PARAMETER_DEFINITION (0..N); CATALOG_ACTION (1) supports ACTION_TARGET_SLOT (0..N); RESOURCE_TYPE (1) accepted by ACTION_TARGET_SLOT (0..N); RESOURCE_TYPE (1) selects TEMPLATE_TARGET (0..N); TEMPLATE_ACTION (1) binds TEMPLATE_BINDING (0..N); TEMPLATE_TARGET (1) referenced by TEMPLATE_BINDING (0..N); TEMPLATE_ACTION (1) predecessor TEMPLATE_DEPENDENCY (0..N); TEMPLATE_ACTION (1) successor TEMPLATE_DEPENDENCY (0..N); EXPERIMENT_TEMPLATE (1) configures TEMPLATE_TARGET_ACCOUNT (0..N)</desc>
