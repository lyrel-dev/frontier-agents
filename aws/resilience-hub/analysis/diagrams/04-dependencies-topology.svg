<rect x="335" y="1028" width="13" height="13" rx="3" fill="#087f83"/><text font-family="sans-serif" x="357" y="1040" fill="#53677c" class="link" font-size="14">Local normalization or evidence</text>
<text font-family="sans-serif" x="32" y="1072" fill="#53677c" class="note" font-size="16">Both endpoint foreign keys include topologyId; unresolved endpoints remain snapshot-scoped stubs.</text>
<text font-family="sans-serif" x="32" y="1096" fill="#53677c" class="note" font-size="16">No native dependency-to-topology foreign key exists. COMPLETE is collector completion, not an atomic graph.</text>
<text font-family="sans-serif" x="32" y="1120" fill="#53677c" class="note" font-size="16">Governance is independently versioned and cannot change observed DNS evidence or grant access.</text>
