<text font-family="sans-serif" x="940" y="623" fill="#53677c" class="meta" font-size="13">DETAIL observation only</text>
<text font-family="sans-serif" x="940" y="643" fill="#16304a" class="field" font-size="16">category</text>
<text font-family="sans-serif" x="940" y="663" fill="#53677c" class="meta" font-size="13">Source recommendation array</text>
<text font-family="sans-serif" x="940" y="683" fill="#16304a" class="field" font-size="16">sourceArrayOrdinal</text>
<text font-family="sans-serif" x="940" y="705" fill="#16304a" class="field" font-size="16">suggestedChanges</text>
<rect x="32" y="841" width="13" height="13" rx="3" fill="#183750"/><text font-family="sans-serif" x="54" y="853" fill="#53677c" class="link" font-size="14">AWS-backed identity or value</text>
<rect x="335" y="841" width="13" height="13" rx="3" fill="#087f83"/><text font-family="sans-serif" x="357" y="853" fill="#53677c" class="link" font-size="14">Local normalization or evidence</text>
<text font-family="sans-serif" x="32" y="885" fill="#53677c" class="note" font-size="16">Observation uniqueness: (captureId, serviceArn, findingId, representation). Recommendations require DETAIL.</text>
<text font-family="sans-serif" x="32" y="909" fill="#53677c" class="note" font-size="16">relatedAssessmentId joins with the capture serviceArn. It records correlation, not an authoritative result set.</text>
<text font-family="sans-serif" x="32" y="933" fill="#53677c" class="note" font-size="16">List coverage and detail hydration coverage are independent. Missing recommendation data is not an empty set.</text>
</svg>
