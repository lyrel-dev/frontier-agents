<text font-family="sans-serif" x="50" y="629" fill="#16304a" class="field" font-size="16">captureCompletedAt</text>
<text font-family="sans-serif" x="50" y="651" fill="#16304a" class="field" font-size="16">listCoverage</text>
<text font-family="sans-serif" x="50" y="673" fill="#16304a" class="field" font-size="16">detailCoverage</text>
<text font-family="sans-serif" x="50" y="695" fill="#16304a" class="field" font-size="16">relatedAssessmentId  [FK]</text>
<text font-family="sans-serif" x="50" y="715" fill="#53677c" class="meta" font-size="13">Optional same-service correlation</text>
