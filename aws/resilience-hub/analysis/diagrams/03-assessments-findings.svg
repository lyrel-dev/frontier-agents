<text font-family="sans-serif" x="32" y="42" fill="#16304a" font-size="25" font-weight="700">Assessments, finding captures and recommendations</text>
<text font-family="sans-serif" x="32" y="69" fill="#53677c" font-size="16">Findings are service-scoped. Captures preserve observation history without inventing run ownership.</text>
