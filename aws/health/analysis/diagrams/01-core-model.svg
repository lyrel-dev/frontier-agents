<svg xmlns="http://www.w3.org/2000/svg" width="980" height="870" viewBox="0 0 980 870" role="img" aria-labelledby="01-core-model-title 01-core-model-desc">
<title id="01-core-model-title">AWS Health event and account impact</title>
<desc id="01-core-model-desc">A shared event identity has public, account, or organization-summary evidence contexts. Account and organization references are conditional. Entity impacts belong to the applicable context; organization summaries own no impacts. Organization membership is external and time-bounded. Cardinalities describe the proposed normalized application model. Teal means AWS facts, blue means application model, and amber means external context. Labels 1, 0..1, 0..n, and 1..n give cardinality. PUBLIC has no account. ACCOUNT has one account. ORG_SUMMARY has one organization and owns no impacts.</desc>
<rect x="0" y="0" width="980" height="870" fill="#FFFFFF"/>
<text x="30" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#23364A">AWS Health event and account impact</text>
<text x="30" y="53" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#53677B">Provider identity, conditional evidence contexts, and event-relative impact.</text>
<rect x="30" y="76" width="13" height="13" rx="3" fill="#EAF5F6" stroke="#087884"/>
<text x="50" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">AWS facts</text>
<rect x="250" y="76" width="13" height="13" rx="3" fill="#EDF2FA" stroke="#2456A1"/>
<text x="270" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">Application model</text>
<rect x="505" y="76" width="13" height="13" rx="3" fill="#FAF5E9" stroke="#936209"/>
<text x="525" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">External context</text>
<text x="744" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#53677B">Cardinality: minimum..maximum</text>
