<svg xmlns="http://www.w3.org/2000/svg" width="980" height="920" viewBox="0 0 980 920" role="img" aria-labelledby="02-history-delivery-title 02-history-delivery-desc">
<title id="02-history-delivery-title">AWS evidence history and notification delivery</title>
<desc id="02-history-delivery-desc">Event and entity revisions retain independent provider update clocks and reference immutable source observations. AWS communications are grouped locally, split into logical pages, and delivered one or more times. The local communicationRecordId is distinct from AWS rawCommunicationId. API observations can exist without a message delivery. Teal means AWS facts, blue means application model, and amber means external context. Labels 1, 0..1, 0..n, and 1..n give cardinality. Source observations are immutable. A later collection time does not make the underlying provider evidence newer.</desc>
<rect x="0" y="0" width="980" height="920" fill="#FFFFFF"/>
<text x="30" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#23364A">AWS evidence history and notification delivery</text>
<text x="30" y="53" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#53677B">Local communication grouping, raw AWS identity, and independent event/entity clocks.</text>
<rect x="30" y="76" width="13" height="13" rx="3" fill="#EAF5F6" stroke="#087884"/>
<text x="50" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">AWS facts</text>
<rect x="250" y="76" width="13" height="13" rx="3" fill="#EDF2FA" stroke="#2456A1"/>
<text x="270" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">Application model</text>
<rect x="505" y="76" width="13" height="13" rx="3" fill="#FAF5E9" stroke="#936209"/>
<text x="525" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">External context</text>
<text x="744" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#53677B">Cardinality: minimum..maximum</text>
