<svg xmlns="http://www.w3.org/2000/svg" width="980" height="935" viewBox="0 0 980 935" role="img" aria-labelledby="03-lifecycle-posture-title 03-lifecycle-posture-desc">
<title id="03-lifecycle-posture-title">Version catalog and derived lifecycle exposure</title>
<desc id="03-lifecycle-posture-desc">AWS service-version catalog entries contain milestones. Independently collected inventory records describe deployed components. A locally derived lifecycle exposure joins one deployment to one milestone with applicability and matching evidence. Catalog milestone identity and exposure are local constructs; the API supplies no direct resource or Health-event linkage. Teal means AWS facts, blue means application model, and amber means external context. Labels 1, 0..1, 0..n, and 1..n give cardinality. Catalog IDs are local. AWS supplies no direct catalog-to-resource or catalog-to-Health-event foreign key.</desc>
<rect x="0" y="0" width="980" height="935" fill="#FFFFFF"/>
<text x="30" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#23364A">Version catalog and derived lifecycle exposure</text>
<text x="30" y="53" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#53677B">Provider lifecycle facts meet independently observed deployments through an explicit assessment.</text>
<rect x="30" y="76" width="13" height="13" rx="3" fill="#EAF5F6" stroke="#087884"/>
<text x="50" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">AWS facts</text>
<rect x="250" y="76" width="13" height="13" rx="3" fill="#EDF2FA" stroke="#2456A1"/>
<text x="270" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">Application model</text>
<rect x="505" y="76" width="13" height="13" rx="3" fill="#FAF5E9" stroke="#936209"/>
<text x="525" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">External context</text>
<text x="744" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#53677B">Cardinality: minimum..maximum</text>
