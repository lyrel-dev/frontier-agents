<svg xmlns="http://www.w3.org/2000/svg" width="980" height="860" viewBox="0 0 980 860" role="img" aria-labelledby="04-operator-workflow-title 04-operator-workflow-desc">
<title id="04-operator-workflow-title">Operator workflow and immutable action history</title>
<desc id="04-operator-workflow-desc">Work items contain application-owned workflow, ownership, and priority. Each work-item target references exactly one event context, entity impact, or lifecycle exposure; multiple targets support coordinated work. Operator actions record authorship and evidence without modifying AWS provider statuses. Teal means AWS facts, blue means application model, and amber means external context. Labels 1, 0..1, 0..n, and 1..n give cardinality. Exactly one target FK is set per WorkItemTarget. Completing work never rewrites an AWS provider status.</desc>
<rect x="0" y="0" width="980" height="860" fill="#FFFFFF"/>
<text x="30" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#23364A">Operator workflow and immutable action history</text>
<text x="30" y="53" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#53677B">Application-owned response work and auditable actions retain their own state.</text>
<rect x="30" y="76" width="13" height="13" rx="3" fill="#EAF5F6" stroke="#087884"/>
<text x="50" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">AWS facts</text>
<rect x="250" y="76" width="13" height="13" rx="3" fill="#EDF2FA" stroke="#2456A1"/>
<text x="270" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">Application model</text>
<rect x="505" y="76" width="13" height="13" rx="3" fill="#FAF5E9" stroke="#936209"/>
<text x="525" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#23364A">External context</text>
<text x="744" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#53677B">Cardinality: minimum..maximum</text>
