stent memory</text><text class="detail" x="862" y="148">Preferences,</text><text class="detail" x="862" y="171">corrections and task</text><text class="detail" x="862" y="194">outcomes</text></g><g data-node="execution" data-box="270,270,840,140" data-owner="aws"><rect x="270" y="270" width="840" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="290">AWS</text><text class="label" x="282" y="313">Analysis execution</text><text class="detail" x="282" y="336">Direct conversation or an explicitly created queued task</text></g><g data-node="connections" data-box="470,470,350,140" data-owner="aws"><rect x="470" y="470" width="350" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="482" y="490">AWS</text><text class="label" x="482" y="513">Data and destination access</text><text class="detail" x="482" y="536">Source permissions; separate</text><text class="detail" x="482" y="559">Jira / Slack binding</text><circle data-reading-step="2" cx="805" cy="487" r="12" fill="#DCEBFF" stroke="#447AC2"/><text x="801" y="492" font-size="14">2</text></g><g data-node="learning" data-box="875,470,235,140" data-owner="aws"><rect x="875" y="470" width="235" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="887" y="490">AWS</text><text class="label" x="887" y="513">Context</text><text class="label" x="887" y="536">maintenance</text><text class="detail" x="887" y="559">Memory updates;</text><text class="detail" x="887" y="582">separate compaction</text></g><g data-node="sources" data-box="470,650,350,110" data-owner="external"><rect x="470" y="650" width="350" height="110" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="482" y="670">EXT</text><text class="label" x="482" y="693">AWS data sources</text><text class="detail" x="482" y="716">Cost, anomaly and</text><text class="detail" x="482" y="739">recommendation services</text><circle 