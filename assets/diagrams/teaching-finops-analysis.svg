<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 825" role="img" aria-labelledby="teaching-finops-analysis-title teaching-finops-analysis-desc" data-diagram="teaching-finops-analysis" data-layout="teaching-fixed-v1" data-product="finops" data-view="analysis"><title id="teaching-finops-analysis-title">Historical cost and anomaly analysis retain source provenance</title><desc id="teaching-finops-analysis-desc">Stable component positions. Color identifies concept ownership; heavier borders and numbered reading steps identify the active workflow. This is a logical teaching view, not a service call graph.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#465768"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182d3d}.label{font-size:21px;font-weight:600}.detail{font-size:19px}.tag{font-size:14px;font-weight:700}.edge{fill:none;stroke:#465768;stroke-width:2.2;marker-end:url(#arrow)}.edge-soft{fill:none;stroke:#6b7785;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect data-scope-boundary="true" x="240" y="35" width="1160" height="580" rx="12" fill="#fbfcfd" stroke="#348761" stroke-width="2" stroke-dasharray="9 5"/><text x="255" y="58" font-size="18">Agent instance — access, context, work records and destination connections</text><path data-edge="request-execution" class="edge" d="M220 350 H270"/><path data-edge="instructions-execution" class="edge" d="M400 222 V270"/><path data-edge="skills-execution" class="edge-soft" d="M690 222 V270"/><path data-edge="knowledge-execution" class="edge-soft" d="M980 222 V270"/><path data-edge="execution-result" class="edge" d="M1110 350 H1170"/><path data-edge="execution-connections" class="edge" d="M645 410 V470" marker-start="url(#arrow)"/><path data-edge="connections-sources" class="edge" d="M645 610 V650" marker-start="url(#arrow)"/><text x="665" y="447" font-size="16">invoke / observe</text><tex