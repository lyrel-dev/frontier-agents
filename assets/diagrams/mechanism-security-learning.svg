<title id="mechanism-security-learning-title">Security reuse: login navigation and finding preferences</title><desc id="mechanism-security-learning-desc">The two retained processes have different producers and effects. Disabling reuse or personalization preserves learned material; neither operation repairs the application. Green/AWS: documented service concept. Blue/DOC: our verification procedure. Orange/EXT: engineering-owned source. Stages are logical explanations, not API status enum values.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 367)">
