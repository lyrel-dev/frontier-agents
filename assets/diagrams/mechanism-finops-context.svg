<title id="mechanism-finops-context-title">FinOps context: three independent lifecycle operations</title><desc id="mechanism-finops-context-desc">File restoration, memory updates and conversation compaction operate on different representations. Their controls do not remove copies held in other representations. Green/AWS: documented service concept. Blue/DOC: our verification procedure. Orange/EXT: engineering-owned source. Stages are logical explanations, not API status enum values.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 263)">
