<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 825" role="img" aria-labelledby="teaching-finops-reporting-title teaching-finops-reporting-desc" data-diagram="teaching-finops-reporting" data-layout="teaching-fixed-v1" data-product="finops" data-view="reporting"><title id="teaching-finops-reporting-title">Periodic reporting adds a task definition and publication path</title><desc id="teaching-finops-reporting-desc">Fixed-position teaching view. Color identifies who defines the concept; heavy outlines identify the current path. Arrows show documented information use or explicitly labeled team actions, not internal RPCs or a universal agent orchestration graph. Agent instance: access roles, organizational context, conversations, tasks and connections.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#465768"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182d3d}.label{font-size:20px;font-weight:600}.detail{font-size:17px}.tag{font-size:14px;font-weight:700}.edge{fill:none;stroke:#465768;stroke-width:2;marker-end:url(#arrow)}.edge-soft{fill:none;stroke:#6b7785;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect x="240" y="35" width="900" height="580" rx="12" fill="#fbfcfd" stroke="#348761" stroke-width="2" stroke-dasharray="9 5"/><text x="255" y="58" font-size="17">Agent instance: access roles, organizational context, conversations, tasks and connections</text><path data-edge="request-execution" class="edge" d="M220 338 H270"/><path data-edge="instructions-execution" class="edge" d="M400 200 V270"/><path data-edge="skills-execution" class="edge" d="M690 200 V270"/><path data-edge="knowledge-execution" class="edge-soft" d="M980 200 V270"/><path data-edge="execution-result" class="edge" d="M1110 338 H1170"/><path data-edge="execution-connections" class="edge" d="M645 400 V470" marker-start="url(#arrow)"/><path data-edge="connections-sources" class="edge-soft" d="M645 582 V650" marker-start="url(#arrow)"/><text x="665" y="438" font-size="16">invoke / observe</text><text x="665" y="636" font-size="16">authorized access</text><path class="edge-soft" data-edge="result-learning" d="M1275 396 V603 H1118 V526 H1110"/><path class="edge-soft" data-edge="learning-knowledge" d="M995 470 V430 H1122 V220 H980 V200"/><path class="edge-soft" data-edge="operator-execution" d="M220 523 H250 V365 H270"/><g data-node="request" data-box="15,280,205,140" data-owner="external"><rect x="15" y="280" width="205" height="140" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="27" y="300">EXT</text><text class="label" x="27" y="323">Question or</text><text class="label" x="27" y="344">trigger</text><text class="detail" x="27" y="365">Query, explicit</text><text class="detail" x="27" y="386">task, schedule or</text><text class="detail" x="27" y="407">anomaly event</text></g><g data-node="instructions" data-box="270,82,260,140" data-owner="aws"><rect x="270" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="102">AWS</text><text class="label" x="282" y="125">Request / task</text><text class="label" x="282" y="146">instructions</text><text class="detail" x="282" y="167">Query basis and requested</text><text class="detail" x="282" y="188">analysis</text></g><g data-node="skills" data-box="560,82,260,140" data-owner="aws"><rect x="560" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="572" y="102">AWS</text><text class="label" x="572" y="125">Context files</text><text class="detail" x="572" y="146">Ownership mappings,</text><text class="detail" x="572" y="167">instructions and report</text><text class="detail" x="572" y="188">templates</text></g><g data-node="knowledge" data-box="850,82,260,140" data-owner="aws"><rect x="850" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="862" y="102">AWS</text><text class="label" x="862" y="125">Persistent memory</text><text class="detail" x="862" y="146">Preferences, corrections</text><text class="detail" x="862" y="167">and retained task outcomes</text></g><g data-node="execution" data-box="270,270,840,140" data-owner="aws"><rect x="270" y="270" width="840" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="290">AWS</text><text class="label" x="282" y="313">Analysis execution</text><text class="detail" x="282" y="334">Direct conversation or an explicitly created queued task</text></g><g data-node="connections" data-box="470,470,350,140" data-owner="aws"><rect x="470" y="470" width="350" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="482" y="490">AWS</text><text class="label" x="482" y="513">Data access and destinations</text><text class="detail" x="482" y="534">Agent data role; separate Jira or</text><text class="detail" x="482" y="555">Slack connection</text></g><g data-node="learning" data-box="875,470,235,140" data-owner="aws"><rect x="875" y="470" width="235" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="887" y="490">AWS</text><text class="label" x="887" y="513">Context</text><text class="label" x="887" y="534">maintenance</text><text class="detail" x="887" y="555">Memory updates; session</text><text class="detail" x="887" y="576">compaction is separate</text></g><g data-node="sources" data-box="470,650,350,110" data-owner="external"><rect x="470" y="650" width="350" height="110" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="1"/><text class="tag" x="482" y="670">EXT</text><text class="label" x="482" y="693">Underlying AWS sources</text><text class="detail" x="482" y="714">Cost Explorer, anomaly and</text><text class="detail" x="482" y="735">recommendation services</text></g><g data-node="result" data-box="1170,280,215,140" data-owner="aws"><rect x="1170" y="280" width="215" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="1182" y="300">AWS</text><text class="label" x="1182" y="323">Analysis output</text><text class="detail" x="1182" y="344">Answer, report</text><text class="detail" x="1182" y="365">artifact and recorded</text><text class="detail" x="1182" y="386">task result</text></g><g data-node="operator" data-box="15,470,205,140" data-owner="external"><rect x="15" y="470" width="205" height="140" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="27" y="490">EXT</text><text class="label" x="27" y="513">FinOps / service</text><text class="label" x="27" y="534">owner</text><text class="detail" x="27" y="555">Reconcile, authorize</text><text class="detail" x="27" y="576">publication and own</text><text class="detail" x="27" y="597">changes</text></g><text x="20" y="810" font-size="17">DOC: documentation-defined  |  AWS: documented service concept  |  EXT: external system or team</text></svg>