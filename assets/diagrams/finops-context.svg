<title id="finops-context-title">Persistent context and session-local working state</title><desc id="finops-context-desc">Uploaded files and conversational memory persist within an instance. They are loaded into an isolated ephemeral session runtime. Older messages may be summarized; that is separate from editing a file or a retained preference.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 367)">
