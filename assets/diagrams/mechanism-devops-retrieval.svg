<title id="mechanism-devops-retrieval-title">Incident memory: production, availability and retrieval</title><desc id="mechanism-devops-retrieval-desc">Producing context does not prove a later execution selected it. Activation and applicable attachments control availability; current evidence controls interpretation. Green/AWS: documented service concept. Blue/DOC: our verification procedure. Orange/EXT: engineering-owned source. Stages are logical explanations, not API status enum values.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 482)">
