<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 825" role="img" aria-labelledby="teaching-devops-incident-title teaching-devops-incident-desc" data-diagram="teaching-devops-incident" data-layout="teaching-fixed-v1" data-product="devops" data-view="incident"><title id="teaching-devops-incident-title">Incident triage and current-evidence investigation</title><desc id="teaching-devops-incident-desc">Stable component positions. Color identifies concept ownership; heavier borders and numbered reading steps identify the active workflow. This is a logical teaching view, not a service call graph.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#465768"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182d3d}.label{font-size:21px;font-weight:600}.detail{font-size:19px}.tag{font-size:14px;font-weight:700}.edge{fill:none;stroke:#465768;stroke-width:2.2;marker-end:url(#arrow)}.edge-soft{fill:none;stroke:#6b7785;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect data-scope-boundary="true" x="240" y="35" width="1160" height="580" rx="12" fill="#fbfcfd" stroke="#348761" stroke-width="2" stroke-dasharray="9 5"/><text x="255" y="58" font-size="18">Agent Space — access, definitions, context and execution records</text><path data-edge="request-execution" class="edge" d="M220 350 H270"/><path data-edge="instructions-execution" class="edge-soft" d="M400 222 V270"/><path data-edge="skills-execution" class="edge-soft" d="M690 222 V270"/><path data-edge="knowledge-execution" class="edge" d="M980 222 V270"/><path data-edge="execution-result" class="edge" d="M1110 350 H1170"/><path data-edge="execution-connections" class="edge" d="M645 410 V470" marker-start="url(#arrow)"/><path data-edge="connections-sources" class="edge" d="M645 610 V650" marker-start="url(#arrow)"/><text x="665" y="447" font-size="16">invoke / observe</text><text x="665" y="637" font-size="16">authorized access</text><path class="edge-soft" data-edge="result-learning" d="M1170 380 H1150 V540 H1110"/><path class="edge-soft" data-edge="learning-knowledge" d="M995 470 V438 H1125 V245 H980 V222"/><path class="edge-soft" data-edge="sources-learning" d="M820 705 H1150 V570 H1110"/><path class="edge-soft" data-edge="operator-execution" d="M220 540 H250 V380 H270"/><path class="edge-soft" data-edge="result-destination" d="M1385 350 H1420 V705 H1385"/><text x="1200" y="565" font-size="16">Optional publication</text><text x="1200" y="588" font-size="16">Destination-specific</text><text x="1200" y="611" font-size="16">authorization</text><g data-node="request" data-box="15,280,205,140" data-owner="external"><rect x="15" y="280" width="205" height="140" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="27" y="300">EXT</text><text class="label" x="27" y="323">Request /</text><text class="label" x="27" y="346">signal</text><text class="detail" x="27" y="369">Question, signal</text><text class="detail" x="27" y="392">or trigger</text><circle data-reading-step="1" cx="205" cy="297" r="12" fill="#DCEBFF" stroke="#447AC2"/><text x="201" y="302" font-size="14">1</text></g><g data-node="instructions" data-box="270,82,260,140" data-owner="aws"><rect x="270" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="282" y="102">AWS</text><text class="label" x="282" y="125">Instructions</text><text class="detail" x="282" y="148">Managed AGENTS.md or</text><text class="detail" x="282" y="171">custom prompt</text></g><g data-node="skills" data-box="560,82,260,140" data-owner="aws"><rect x="560" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="572" y="102">AWS</text><text class="label" x="572" y="125">Skills</text><text class="detail" x="572" y="148">Applicable or assigned</text><text class="detail" x="572" y="171">procedures</text></g><g data-node="knowledge" data-box="850,82,260,140" data-owner="aws"><rect x="850" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="862" y="102">AWS</text><text class="label" x="862" y="125">Memory stores</text><text class="detail" x="862" y="148">Available context;</text><text class="detail" x="862" y="171">selected entries</text></g><g data-node="execution" data-box="270,270,840,140" data-owner="aws"><rect x="270" y="270" width="840" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="290">AWS</text><text class="label" x="282" y="313">Managed incident work</text><text class="detail" x="282" y="336">Roles contribute to the investigation context and its outputs.</text><rect x="284" y="352" width="194" height="45" rx="3" fill="#ffffff" stroke="#348761"/><text x="292" y="370" font-size="16">Incident triage</text><text x="292" y="388" font-size="14">Route the signal</text><rect x="488" y="352" width="194" height="45" rx="3" fill="#ffffff" stroke="#348761"/><text x="496" y="370" font-size="16">Incident RCA</text><text x="496" y="388" font-size="14">Investigate evidence</text><rect x="692" y="352" width="194" height="45" rx="3" fill="#ffffff" stroke="#348761"/><text x="700" y="370" font-size="16">Incident mitigation</text><text x="700" y="388" font-size="14">Propose a response</text><rect x="896" y="352" width="194" height="45" rx="3" fill="#ffffff" stroke="#348761"/><text x="904" y="370" font-size="16">Incident UI</text><text x="904" y="388" font-size="14">Present the output</text><circle data-reading-step="2" cx="1095" cy="287" r="12" fill="#DCEBFF" stroke="#447AC2"/><text x="1091" y="292" font-size="14">2</text></g><g data-node="connections" data-box="470,470,350,140" data-owner="aws"><rect x="470" y="470" width="350" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="482" y="490">AWS</text><text class="label" x="482" y="513">Integrations and tools</text><text class="detail" x="482" y="536">Provider association; selected</text><text class="detail" x="482" y="559">operations</text><circle data-reading-step="3" cx="805" cy="487" r="12" fill="#DCEBFF" stroke="#447AC2"/><text x="801" y="492" font-size="14">3</text></g><g data-node="learning" data-box="875,470,235,140" data-owner="aws"><rect x="875" y="470" width="235" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="1"/><text class="tag" x="887" y="490">AWS</text><text class="label" x="887" y="513">Knowledge</text><text class="label" x="887" y="536">production</text><text class="detail" x="887" y="559">Learning runs;</text><text class="detail" x="887" y="582">feedback reflections</text></g><g data-node="sources" data-box="470,650,350,110" data-owner="external"><rect x="470" y="650" width="350" height="110" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="482" y="670">EXT</text><text class="label" x="482" y="693">Source systems</text><text class="detail" x="482" y="716">Resources, telemetry, code and</text><text class="detail" x="482" y="739">deployment</text></g><g data-node="result" data-box="1170,280,215,140" data-owner="aws"><rect x="1170" y="280" width="215" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="1182" y="300">AWS</text><text class="label" x="1182" y="323">Result / record</text><text class="detail" x="1182" y="346">Findings, plans,</text><text class="detail" x="1182" y="369">artifacts and</text><text class="detail" x="1182" y="392">history</text><circle data-reading-step="4" cx="1370" cy="297" r="12" fill="#DCEBFF" stroke="#447AC2"/><text x="1366" y="302" font-size="14">4</text></g><g data-node="operator" data-box="15,470,205,140" data-owner="external"><rect x="15" y="470" width="205" height="140" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="1"/><text class="tag" x="27" y="490">EXT</text><text class="label" x="27" y="513">Operator</text><text class="detail" x="27" y="536">Scope, feedback,</text><text class="detail" x="27" y="559">approval and</text><text class="detail" x="27" y="582">review</text></g><g data-node="destination" data-box="1170,650,215,110" data-owner="external"><rect x="1170" y="650" width="215" height="110" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="1"/><text class="tag" x="1182" y="670">EXT</text><text class="label" x="1182" y="693">Destination</text><text class="detail" x="1182" y="716">Configured channel</text><text class="detail" x="1182" y="739">or event consumer</text></g><text x="20" y="785" font-size="17">Numbered circles mark reading steps. Other components remain in place for comparison.</text><text x="20" y="810" font-size="17">DOC: documentation-defined  |  AWS: documented service concept  |  EXT: external system or team</text></svg>