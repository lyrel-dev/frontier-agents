<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 825" role="img" aria-labelledby="teaching-finops-agent-title teaching-finops-agent-desc" data-diagram="teaching-finops-agent" data-layout="teaching-fixed-v1" data-product="finops" data-view="agent"><title id="teaching-finops-agent-title">FinOps analysis combines source data and organizational context</title><desc id="teaching-finops-agent-desc">Stable component positions. Color identifies concept ownership; heavier borders and numbered reading steps identify the active workflow. This is a logical teaching view, not a service call graph.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#465768"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182d3d}.label{font-size:21px;font-weight:600}.detail{font-size:19px}.tag{font-size:14px;font-weight:700}.edge{fill:none;stroke:#465768;stroke-width:2.2;marker-end:url(#arrow)}.edge-soft{fill:none;stroke:#6b7785;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><path data-edge="request-execution" class="edge" d="M220 350 H270"/><path data-edge="instructions-execution" class="edge" d="M400 222 V270"/><path data-edge="skills-execution" class="edge" d="M690 222 V270"/><path data-edge="knowledge-execution" class="edge" d="M980 222 V270"/><path data-edge="execution-result" class="edge" d="M1110 350 H1170"/><path data-edge="execution-connections" class="edge" d="M645 410 V470" marker-start="url(#arrow)"/><path data-edge="connections-sources" class="edge" d="M645 610 V650" marker-start="url(#arrow)"/><text x="665" y="447" font-size="16">invoke / observe</text><text x="665" y="637" font-size="16">authorized access</text><g data-node="request" data-box="15,280,205,140" data-owner="external"><rect x="15" y="280" width="205" height="140" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="27" y="300">EXT</text><text class="label" x="27" y="323">Question /</text><text class="label" x="27" y="346">trigger</text><text class="detail" x="27" y="369">Question,</text><text class="detail" x="27" y="392">explicit task or</text><text class="detail" x="27" y="415">automation</text></g><g data-node="instructions" data-box="270,82,260,140" data-owner="aws"><rect x="270" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="102">AWS</text><text class="label" x="282" y="125">Work instructions</text><text class="detail" x="282" y="148">Query basis and</text><text class="detail" x="282" y="171">requested analysis</text></g><g data-node="skills" data-box="560,82,260,140" data-owner="aws"><rect x="560" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="572" y="102">AWS</text><text class="label" x="572" y="125">Context files</text><text class="detail" x="572" y="148">Mappings, instructions</text><text class="detail" x="572" y="171">and report templates</text></g><g data-node="knowledge" data-box="850,82,260,140" data-owner="aws"><rect x="850" y="82" width="260" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="862" y="102">AWS</text><text class="label" x="862" y="125">Persistent memory</text><text class="detail" x="862" y="148">Preferences,</text><text class="detail" x="862" y="171">corrections and task</text><text class="detail" x="862" y="194">outcomes</text></g><g data-node="execution" data-box="270,270,840,140" data-owner="aws"><rect x="270" y="270" width="840" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="282" y="290">AWS</text><text class="label" x="282" y="313">Analysis execution</text><text class="detail" x="282" y="336">Direct conversation or an explicitly created queued task</text></g><g data-node="connections" data-box="470,470,350,140" data-owner="aws"><rect x="470" y="470" width="350" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="482" y="490">AWS</text><text class="label" x="482" y="513">Data and destination access</text><text class="detail" x="482" y="536">Source permissions; separate</text><text class="detail" x="482" y="559">Jira / Slack binding</text></g><g data-node="sources" data-box="470,650,350,110" data-owner="external"><rect x="470" y="650" width="350" height="110" rx="7" fill="#FCE8D5" stroke="#C78335" stroke-width="4"/><text class="tag" x="482" y="670">EXT</text><text class="label" x="482" y="693">AWS data sources</text><text class="detail" x="482" y="716">Cost, anomaly and</text><text class="detail" x="482" y="739">recommendation services</text></g><g data-node="result" data-box="1170,280,215,140" data-owner="aws"><rect x="1170" y="280" width="215" height="140" rx="7" fill="#D9F2E5" stroke="#348761" stroke-width="4"/><text class="tag" x="1182" y="300">AWS</text><text class="label" x="1182" y="323">Analysis result</text><text class="detail" x="1182" y="346">Answer, artifact</text><text class="detail" x="1182" y="369">and task result</text></g><text x="20" y="810" font-size="17">DOC: documentation-defined  |  AWS: documented service concept  |  EXT: external system or team</text></svg>