<title id="mechanism-security-replay-title">Finding revalidation: evidence and result boundaries</title><desc id="mechanism-security-replay-desc">Revalidation creates a separate job for selected existing findings. Non-reproduction must be interpreted under the identity and path actually reached; it is not broad new discovery. Green/AWS: documented service concept. Blue/DOC: our verification procedure. Orange/EXT: engineering-owned source. Stages are logical explanations, not API status enum values.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 367)">
