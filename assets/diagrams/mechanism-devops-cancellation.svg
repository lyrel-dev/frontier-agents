<svg xmlns="http://www.w3.org/2000/svg" width="528pt" height="396pt" viewBox="0.00 0.00 527.50 396.00" role="img" aria-labelledby="mechanism-devops-cancellation-title mechanism-devops-cancellation-desc" data-diagram="mechanism-devops-cancellation">
<title id="mechanism-devops-cancellation-title">Custom work: future triggers and current invocations</title><desc id="mechanism-devops-cancellation-desc">Pausing a schedule stops future starts. Cancelling an invocation preserves completed evidence and may not interrupt a tool call already in progress. The scheduling window is not a delivery SLA. Green/AWS: documented service concept. Blue/DOC: our verification procedure. Orange/EXT: engineering-owned source. Stages are logical explanations, not API status enum values.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 378)">
