# Build/load localhost/validation-console:0.2.1 into your LOCAL cluster first.
# No Ingress, hostPath, engine socket, or cloud credentials are configured.
apiVersion: v1
kind: Namespace
metadata:
  name: validation-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspector
  namespace: validation-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-metadata-reader
  namespace: validation-console
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inspector-metadata
  namespace: validation-console
subjects:
  - kind: ServiceAccount
    name: inspector
    namespace: validation-console
roleRef:
  kind: Role
  name: workload-metadata-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-config
  namespace: validation-console
data:
  config.json: |
    {"connections":[{"id":"local-cluster","name":"Console namespace","kind":"kubernetes","in_cluster":true,"namespaces":["validation-console"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validation-data
  namespace: validation-console
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  # Uses the default StorageClass. Verify that its backing storage is local,
  # durable, POSIX-compatible, and appropriate for SQLite before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: validation-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: validation-console
  template:
    metadata:
      labels:
        app: validation-console
    spec:
      serviceAccountName: inspector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: localhost/validation-console:0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: CONSOLE_DATA
              value: /data
            - name: CONSOLE_CONFIG
              value: /config/config.json
            - name: CONSOLE_BIND
              value: 0.0.0.0
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: validation-data
        - name: config
          configMap:
            name: console-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: validation-console
spec:
  type: ClusterIP
  selector:
    app: validation-console
  ports:
    - port: 8787
      targetPort: 8787
