# Native-host example only. Supply a private token file; do not commit its contents.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: agent-validation
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agent-lab-operator-token
    static_configs:
      - targets: ["127.0.0.1:8787"]
