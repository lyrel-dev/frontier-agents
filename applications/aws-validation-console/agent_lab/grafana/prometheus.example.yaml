# Native-host example. Use the distinct scrape-only secret, never the operator token.
# For a container/service hostname, set LAB_ALLOWED_HOSTS to exact approved names.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: agent-validation
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agent-lab-metrics-token
    static_configs:
      - targets: ["127.0.0.1:8787"]
