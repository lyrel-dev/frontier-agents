<script>const APP_DATA = {"catalogue":{"schema_version":"1.0","kind":"validation_bundle","records":[{"id":"EC2-01","revision":1,"title":"EC2 instance stop or termination","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","ecs-ec2"],"domain":"Compute","hypothesis":"The service continues processing requests after one application instance is removed.","procedure":"Choose stop or terminate, not both. Select one explicit instance ID. Use a standalone instance for restart testing or an Auto Scaling member for replacement testing; record which behavior is expected.","fault_mode":"fis","action":"aws:ec2:stop-instances / aws:ec2:terminate-instances","evidence_required":["Instance-state events; target-health changes; failed/eligible requests per measurement window; replacement or restart time; completed writes."],"acceptance":"Request errors stay within E_max; latency stays within L_max; serving capacity returns within T_restore; acknowledged writes are neither missing nor duplicated.","recovery":"Check the original instance and any replacement. Restore desired capacity and verify a new read/write transaction before releasing the test environment.","limitations":["The stop template requests a restart. It does not verify Auto Scaling replacement or restore a terminated instance.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/action-sequence.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-checks-overview.html"],"assertions":[]}},{"id":"EC2-02","revision":1,"title":"EC2 Spot interruption","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","ecs-ec2"],"domain":"Compute","hypothesis":"Workers handle an interruption notice without losing accepted work.","procedure":"Select one Spot worker. Submit numbered jobs to a persistent ledger and enable the actual interruption handler. Record notice, drain and interruption events.","fault_mode":"fis","action":"aws:ec2:send-spot-instance-interruptions","evidence_required":["Notice receipt; checkpoint age; unfinished job IDs; replacement startup; reprocessed jobs and duplicate side effects."],"acceptance":"Every accepted job completes or enters its defined retry state; no duplicate business effect occurs; the queue returns below Q_age within T_restore.","recovery":"Reconcile the job ledger, release stale leases and confirm replacement workers process fresh jobs.","limitations":["Do not substitute a generic task stop when the requirement is to test EC2 interruption-notice handling.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/action-sequence.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"EC2-03","revision":1,"title":"Host CPU, memory or disk exhaustion","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","ecs-ec2"],"domain":"Saturation","hypothesis":"One exhausted host does not consume the service\u2019s entire error allowance.","procedure":"Run one reviewed SSM document against one host. Test CPU, memory and disk separately. Set the resource limit, duration and cleanup command before execution.","fault_mode":"fis","action":"aws:ssm:send-command","evidence_required":["Host utilization and free space; OOM events; application timeouts; offered/completed requests; unaffected-instance performance."],"acceptance":"E_max and L_max hold for the critical transaction; the resource returns to its baseline range and the service stays healthy for W_stable.","recovery":"Stop remaining stress processes, delete only files created by the test and verify free disk space and application health.","limitations":["Include every workload sharing the host in the approval scope. An OS stressor is not evidence of an application memory leak.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/actions-ssm-agent.html","https://docs.aws.amazon.com/fis/latest/userguide/scenario-library-scenarios.html"],"assertions":[]}},{"id":"EC2-04","revision":1,"title":"Scale-out with insufficient capacity","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","ecs-ec2"],"domain":"Capacity","hypothesis":"The configured fallback obtains capacity when the preferred launch option fails.","procedure":"Choose the role/API or Auto Scaling action that matches the actual launch caller. Cause a controlled scale-out while injecting the capacity error.","fault_mode":"fis","action":"aws:ec2:api-insufficient-instance-capacity-error / aws:ec2:asg-insufficient-instance-capacity-error","evidence_required":["Failed launch attempts; selected instance types/AZs; pending work; new instances serving traffic; quota failures."],"acceptance":"An approved fallback provides serving capacity within T_restore, without breaching E_max or Q_age. Unapproved instance types or locations fail the test.","recovery":"Remove the fault, launch one fresh instance through the normal path, then restore the original desired capacity.","limitations":["A failure injected against the wrong IAM role is an invalid test, even if scale-out succeeds.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"EKS-01","revision":1,"title":"EKS pod deletion","simulated":false,"kind":"scenario","data":{"status":"draft","models":["eks-ec2","eks-fargate"],"domain":"Compute","hypothesis":"A controller replaces one deleted application pod without unacceptable request loss.","procedure":"Select one labelled pod in a replicated test workload. Set gracePeriodSeconds explicitly. Keep test traffic running and record the deleted pod UID.","fault_mode":"fis","action":"aws:eks:pod-delete","evidence_required":["Deletion event; replacement UID; Pending/Ready transitions; endpoint registration; dropped requests and interrupted work."],"acceptance":"Ready serving replicas return to the planned count within T_restore; E_max and L_max hold; interrupted jobs are recovered once.","recovery":"Verify replica count, endpoints and a fresh transaction. Remove only FIS-created resources after collecting their logs.","limitations":["Graceful deletion, abrupt node loss and PDB-controlled eviction are different tests. Direct deletion does not establish PDB enforcement.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/eks-pod-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/targets.html","https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"],"assertions":[]}},{"id":"EKS-02","revision":1,"title":"EKS managed-node-group instance loss","simulated":false,"kind":"scenario","data":{"status":"draft","models":["eks-ec2"],"domain":"Compute","hypothesis":"Pods recover on surviving or replacement workers after one managed worker is terminated.","procedure":"Use an explicit managed node group and a bounded instance count. Check placement constraints, storage attachments and available survivor capacity before terminating a worker.","fault_mode":"fis","action":"aws:eks:terminate-nodegroup-instances","evidence_required":["Lost worker ID; Pending reasons; volume attachment events; new worker readiness; ready replicas and transaction results."],"acceptance":"Critical pods become Ready and serve requests within T_restore; no pod remains blocked by placement/storage; E_max and data checks pass.","recovery":"Reconcile node-group size, pod placement and volume attachments. Verify the replacement node can host a new pod.","limitations":["Use separately scoped EC2 tests for self-managed workers. This action is not a general EKS compute-failure interface.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/action-sequence.html"],"assertions":[]}},{"id":"EKS-03","revision":1,"title":"EKS pod CPU, memory or I/O stress","simulated":false,"kind":"scenario","data":{"status":"draft","models":["eks-ec2","eks-fargate"],"domain":"Saturation","hypothesis":"A resource-constrained pod is throttled, restarted or bypassed without causing a service-wide outage.","procedure":"Select one pod and container. Run one resource fault at a time. Verify the ephemeral injector starts and produces the requested effect before measuring resilience.","fault_mode":"fis","action":"aws:eks:pod-cpu-stress / aws:eks:pod-memory-stress / aws:eks:pod-io-stress","evidence_required":["Container utilization; throttling/OOM/restarts; readiness; HPA decisions; transaction latency and throughput."],"acceptance":"The intended resource effect is observed; E_max and L_max hold; replicas and resource use return to baseline for W_stable.","recovery":"Verify the fault process has ended, collect injector logs, and check restarts and resource use after the action.","limitations":["For EKS Fargate, first demonstrate compatibility with the actual pod and security configuration; do not infer it from the absence of an explicit exclusion.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/eks-pod-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/scenario-library-scenarios.html"],"assertions":[]}},{"id":"EKS-04","revision":1,"title":"EKS pod-network impairment","simulated":false,"kind":"scenario","data":{"status":"draft","models":["eks-ec2"],"domain":"Network","hypothesis":"A slow or unreachable dependency does not exhaust the caller\u2019s threads or connection pool.","procedure":"On EKS/EC2, select a dependency path and one fault: latency, packet loss or port blackhole. Confirm the injector permissions and connection scope.","fault_mode":"fis","action":"aws:eks:pod-network-latency / aws:eks:pod-network-packet-loss / aws:eks:pod-network-blackhole-port","evidence_required":["Observed delay/loss; timeout count; pool utilization; retry attempts per original request; circuit-breaker state; critical transactions."],"acceptance":"Retries stay at or below R_max, critical-path latency stays within L_max, and normal calls resume within T_restore after fault removal.","recovery":"Verify fresh connections on the affected path and the removal of the network impairment.","limitations":["These FIS pod-network actions do not work on Fargate. Do not overlap incompatible network actions on the same pod.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/eks-pod-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"ECS-01","revision":1,"title":"ECS service task stop","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ecs-ec2","ecs-fargate"],"domain":"Compute","hypothesis":"The ECS service replaces one stopped task and handles in-flight work correctly.","procedure":"Target one current task ARN in a replicated ECS service. Record its configured stop behavior and ensure the remaining tasks can handle the test load.","fault_mode":"fis","action":"aws:ecs:stop-task","evidence_required":["Task stop/start events; desired/running counts; load-balancer registration; interrupted requests and queue-message outcomes."],"acceptance":"Serving task count returns within T_restore; E_max and L_max hold; accepted messages produce one business result.","recovery":"Check that the replacement receives traffic and that the stopped task\u2019s in-flight work is completed or retried.","limitations":["Standalone tasks are not automatically a service-replacement test. StopTask is not an abrupt host-failure simulation.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"ECS-02","revision":1,"title":"ECS task CPU or I/O stress","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ecs-ec2","ecs-fargate"],"domain":"Saturation","hypothesis":"Task resource exhaustion triggers the intended scaling or load-shedding behavior.","procedure":"Deploy the SSM sidecar in a test task revision. Confirm SSM registration and disable ECS Exec for this workflow. Test CPU and I/O separately.","fault_mode":"fis","action":"aws:ecs:task-cpu-stress / aws:ecs:task-io-stress","evidence_required":["Task/container utilization; resource effect on the application; scaling events; failed requests and completed throughput."],"acceptance":"The measured resource pressure reaches the planned level; E_max and L_max hold; resource use returns to baseline for W_stable.","recovery":"Remove residual stress processes/files; verify healthy tasks and deregistration of temporary SSM managed instances.","limitations":["A sidecar consuming resources does not necessarily reproduce an application-local bottleneck. Measure the application effect.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"ECS-03","revision":1,"title":"ECS application-process failure","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ecs-ec2","ecs-fargate"],"domain":"Compute","hypothesis":"The task\u2019s health and restart configuration detects and recovers a stopped application process.","procedure":"Use the SSM sidecar and task PID mode. Identify the exact application process and signal. Exclude the injector and unrelated sidecar processes.","fault_mode":"fis","action":"aws:ecs:task-kill-process","evidence_required":["Signal/exit event; container and task health; restart or replacement event; request failures; interrupted transactions."],"acceptance":"Unhealthy tasks stop receiving requests; a healthy process serves traffic within T_restore; accepted work is reconciled without duplicate effects.","recovery":"Verify the application process, task health and a new transaction. Remove stale process locks or leases through the application\u2019s recovery procedure.","limitations":["The expected outcome depends on essential-container and restart settings. Write that expectation before running the test.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"ECS-04","revision":1,"title":"ECS task-network impairment","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ecs-ec2","ecs-fargate"],"domain":"Network","hypothesis":"A dependency failure causes bounded retries and recovers without a task-wide connection leak.","procedure":"Configure the SSM sidecar and task PID mode. On Fargate, enable task fault injection and set useEcsFaultInjectionEndpoints=true. Select one dependency and one fault type.","fault_mode":"fis","action":"aws:ecs:task-network-latency / aws:ecs:task-network-packet-loss / aws:ecs:task-network-blackhole-port","evidence_required":["Fault on the selected connections; timeout count; retry amplification; connection-pool use; transaction success."],"acceptance":"R_max and L_max hold; unaffected transactions remain available; connections and queue age recover within T_restore.","recovery":"Test a fresh connection to the dependency, verify impairment removal, and check temporary SSM registrations.","limitations":["Do not run the network actions concurrently on the same task. Endpoint-based injection excludes Windows and unsupported network modes.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html","https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fault-injection.html"],"assertions":[]}},{"id":"LAMBDA-01","revision":1,"title":"Lambda invocation delay or timeout","simulated":false,"kind":"scenario","data":{"status":"draft","models":["lambda"],"domain":"Latency","hypothesis":"Clients and event sources handle delayed invocations without unbounded retries.","procedure":"Instrument a test alias with the FIS extension. Choose delay, duration and invocation percentage. To test timeout handling, deliberately exceed the function timeout in the isolated test.","fault_mode":"fis","action":"aws:lambda:invocation-add-delay","evidence_required":["First/last affected invocation; function and caller duration; timeout errors; retries; concurrency; event age."],"acceptance":"Caller latency/retries meet L_max and R_max; accepted events recover below Q_age within T_restore; no duplicate business writes occur.","recovery":"Confirm fresh invocations are unaffected after configuration removal and reconcile pending events.","limitations":["Injection onset can lag action start. Added delay does not reproduce initialization code, cache state or all cold-start behavior.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"LAMBDA-02","revision":1,"title":"Lambda errors before or after execution","simulated":false,"kind":"scenario","data":{"status":"draft","models":["lambda"],"domain":"Correctness","hypothesis":"Retries remain correct when the caller cannot tell whether a write occurred.","procedure":"Run two separate cases: preventExecution=true, then false. Send uniquely identified writes to a test ledger and record invocation attempts.","fault_mode":"fis","action":"aws:lambda:invocation-error","evidence_required":["Returned errors; handler execution; committed transaction IDs; retry counts; duplicate effects; dead-letter records."],"acceptance":"Before-execution faults produce no write; after-execution errors do not create duplicate effects on retry; every accepted event is reconciled.","recovery":"Verify normal invocation, reconcile the ledger and process test dead-letter records through the approved replay procedure.","limitations":["Set preventExecution explicitly. Otherwise the test plan does not define whether the handler should run.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"LAMBDA-03","revision":1,"title":"Lambda HTTP integration error response","simulated":false,"kind":"scenario","data":{"status":"draft","models":["lambda"],"domain":"Dependency","hypothesis":"The HTTP caller handles a controlled error without treating it as success or retrying indefinitely.","procedure":"Use a test alias behind the actual HTTP integration. Set response status, content type and preventExecution. Send requests through the public application path, not only Invoke.","fault_mode":"fis","action":"aws:lambda:invocation-http-integration-response","evidence_required":["Client-visible status/body; gateway metrics; function execution; retries; correlation IDs and business writes."],"acceptance":"The intended status reaches the client; fallback/error handling matches the API contract; R_max holds and duplicate side effects are absent.","recovery":"Verify normal HTTP responses through the same integration and reconcile any writes made before the error was returned.","limitations":["A changed integration response is not proof of an API Gateway, ALB or regional service outage.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html"],"assertions":[]}},{"id":"LAMBDA-04","revision":1,"title":"Lambda concurrency limit and queue backlog","simulated":false,"kind":"scenario","data":{"status":"draft","models":["lambda"],"domain":"Capacity","hypothesis":"A consumer recovers from constrained concurrency without losing events or overrunning its dependency.","procedure":"In a dedicated test function, save the concurrency/event-source settings, reduce the applicable limit, and submit a fixed set of numbered events.","fault_mode":"external","action":"Custom concurrency configuration + controlled event load","evidence_required":["Concurrent executions; throttles; oldest event age; receive counts; completed event IDs; dead-letter records."],"acceptance":"Every accepted event has one business outcome; Q_age is restored within T_restore; recovery does not exceed downstream capacity.","recovery":"Restore the saved settings, drain/reconcile the test queue and verify a fresh event. Do not raise limits without checking the dependency.","limitations":["This is a controlled configuration/load test, not a native FIS Lambda-throttling action. Match the test to its event source.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html"],"assertions":[]}},{"id":"DATA-01","revision":1,"title":"Database cluster writer failover","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Data","hypothesis":"The application reconnects to the writer and resolves transactions interrupted during failover.","procedure":"Target a supported cluster with an eligible reader. Record the writer and endpoint; generate numbered read/write transactions through the normal connection pool.","fault_mode":"fis","action":"aws:rds:failover-db-cluster","evidence_required":["Writer-change event; connection errors; stale DNS/pool entries; first successful post-failover write; acknowledged transaction ledger."],"acceptance":"Writes recover within T_restore; acknowledged-write loss and duplicate effects stay within the approved invariants; L_max holds after recovery.","recovery":"Check writer/reader health and replication, then reconcile writes. Do not automatically fail back unless the test plan requires it.","limitations":["Confirm cluster type and reader eligibility in the action contract. A cluster failover is not the same test as rebooting a Multi-AZ DB instance.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html","https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html"],"assertions":[]}},{"id":"DATA-02","revision":1,"title":"RDS Multi-AZ DB instance failover","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Data","hypothesis":"The application survives a Multi-AZ DB instance failover without manual connection repair.","procedure":"Target a supported Multi-AZ DB instance and use forceFailover=true. Record DNS/client-cache settings and run a numbered transaction stream.","fault_mode":"fis","action":"aws:rds:reboot-db-instances (forceFailover=true)","evidence_required":["RDS failover events; connection-pool errors; endpoint resolution; successful writes; lost or duplicate transactions."],"acceptance":"The application reconnects within T_restore; all acknowledged writes required by the data contract are present; retries do not duplicate business effects.","recovery":"Verify database availability, fresh connections and the transaction ledger. Check that clients have not retained stale endpoint addresses.","limitations":["Do not apply this plan to a Single-AZ instance or assume identical behavior for a Multi-AZ DB cluster.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"DATA-03","revision":1,"title":"EBS I/O pause or added latency","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","ecs-ec2"],"domain":"Storage","hypothesis":"Storage stalls trigger the intended failover or timeout handling without corrupting application data.","procedure":"Confirm volume/attachment eligibility. Select pause or latency and one test volume. Establish a recovery path that does not require the affected filesystem.","fault_mode":"fis","action":"aws:ebs:pause-volume-io / aws:ebs:volume-io-latency","evidence_required":["Observed I/O latency/stall; application timeout; filesystem/database errors; failover events; write/read checksums."],"acceptance":"The service recovers within T_restore; integrity checks pass; data loss stays within the approved RPO and acknowledged-write rules.","recovery":"Verify I/O resumes, the volume remains correctly attached, and application consistency checks complete. Check for hung processes.","limitations":["Use eligible EBS volumes attached to the selected workload; this is not a generic Fargate or Lambda filesystem test.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fis.html"],"assertions":[]}},{"id":"DATA-04","revision":1,"title":"ElastiCache AZ power-interruption test","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Data","hypothesis":"Cache failover or fallback does not overload the database or invalidate critical state.","procedure":"Select a replication group supported by the action and identify the affected AZ. Run requests that exercise cache reads, misses and writes.","fault_mode":"fis","action":"aws:elasticache:replicationgroup-interrupt-az-power","evidence_required":["Node/failover events; cache error and miss rate; database load; stale reads; client reconnect time."],"acceptance":"Critical requests meet E_max; database load stays below its agreed limit; cache state and latency recover within T_restore.","recovery":"Check replication-group health, client connections and cache-dependent correctness; remove only synthetic test keys.","limitations":["Check the replication-group topology. Do not infer support for serverless caches or treat cache failover as a database recovery test.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/az-availability-scenario.html"],"assertions":[]}},{"id":"DATA-05","revision":1,"title":"DynamoDB global-table replication pause","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Replication","hypothesis":"The application handles replication impairment according to its configured consistency model.","procedure":"Record whether the table uses eventual or strong multi-Region consistency. Select replicas/direction and issue numbered operations from the relevant Regions.","fault_mode":"fis","action":"aws:dynamodb:global-table-pause-replication","evidence_required":["Regional read/write outcomes; replication metrics; stale values or errors; conflicts; record convergence after the action."],"acceptance":"Observed behavior matches the chosen consistency policy; recovered records meet the approved RPO; all test keys reconcile after recovery.","recovery":"Verify replication resumes and compare the test ledger in each relevant replica. Resolve conflicts through the application\u2019s documented rule.","limitations":["Do not use eventual-consistency expectations for a strongly consistent table. Select assertions and quotas for the actual table mode.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-quotas.html","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html"],"assertions":[]}},{"id":"DATA-06","revision":1,"title":"S3 replication pause","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Replication","hypothesis":"Replication monitoring detects delay and the recovery copy catches up after replication resumes.","procedure":"Use a supported bucket with replication configured. Write objects with unique IDs, versions and checksums before and during the pause.","fault_mode":"fis","action":"aws:s3:bucket-pause-replication","evidence_required":["Replication status; pending bytes/operations; object/version arrival; checksum match; alarm and destination-read timestamps."],"acceptance":"The required alert arrives by T_alert; all eligible test objects reach the destination; the recovery copy meets the approved RPO.","recovery":"Verify backlog clearance and checksum equality. Remove test versions according to the bucket\u2019s retention and deletion rules.","limitations":["This tests replication, not GetObject/PutObject availability. Separate source access failures from destination recovery-copy freshness.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html","https://docs.aws.amazon.com/AmazonS3/latest/userguide/disable-replication.html"],"assertions":[]}},{"id":"DATA-07","revision":1,"title":"Kinesis throughput or iterator errors","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Dependency","hypothesis":"Producers and consumers recover from explicit Kinesis errors without losing ordered work.","procedure":"Choose throughput or expired-iterator injection for a test stream. Generate numbered records with known partition keys; retain an independent input ledger.","fault_mode":"fis","action":"aws:kinesis:stream-provisioned-throughput-exception / aws:kinesis:stream-expired-iterator-exception","evidence_required":["Returned exceptions; retry counts; iterator age; checkpoints; ordered consumer results; duplicate effects."],"acceptance":"Every accepted record is accounted for; required per-key ordering holds; R_max and Q_age return within limits by T_restore.","recovery":"Verify fresh reads/writes, checkpoint progression and backlog drain. Reconcile producer acknowledgements against consumer results.","limitations":["Use separate runs for producer throttling and consumer iterator recovery; they exercise different code paths. The service guide and FIS reference use different expired-iterator identifiers; resolve the action with get-action in the target Region.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/streams/latest/dev/kinesis-fis.html"],"assertions":[]}},{"id":"DATA-08","revision":1,"title":"Aurora DSQL connection failure","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Data","hypothesis":"Clients handle connection failure without exhausting pools or violating transaction semantics.","procedure":"Use the supported DSQL action against a test cluster. Open new connections and run numbered transactions through the application\u2019s real client.","fault_mode":"fis","action":"aws:dsql:cluster-connection-failure","evidence_required":["Connection failures; pool wait time; retry count; transaction outcome; successful new connections after removal."],"acceptance":"Connection attempts respect R_max; new transactions recover within T_restore; uncertain commits are resolved without duplicate effects.","recovery":"Verify a new connection and transaction through each relevant application instance; reconcile the transaction ledger.","limitations":["A DSQL connection fault is not an Aurora PostgreSQL/MySQL writer failover and does not test all existing-session failures.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/aurora-dsql/latest/userguide/disaster-recovery-resiliency.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"DATA-09","revision":1,"title":"MemoryDB multi-Region replication pause","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Replication","hypothesis":"The application handles delayed cross-Region state according to its conflict and recovery policy.","procedure":"Select a supported multi-Region cluster. Record replication direction and write uniquely identified test keys from the relevant Regions.","fault_mode":"fis","action":"aws:memorydb:multi-region-cluster-pause-replication","evidence_required":["Replication delay; regional reads; write outcomes; conflicts; key convergence; alert delivery."],"acceptance":"The alert arrives by T_alert; regional behavior matches the approved consistency policy; recovered keys meet RPO and reconciliation rules.","recovery":"Verify replication convergence and application reads before removing synthetic keys.","limitations":["This is a multi-Region replication test, not a generic single-cluster node-failure test.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"NET-01","revision":1,"title":"S3 or DynamoDB access-path loss","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Network","hypothesis":"A workload handles loss of its selected AWS service network path without silently losing work.","procedure":"Identify the exact subnet and supported traffic scope. Prove the test client uses that route. Preserve current network configuration and exclude unrelated consumers.","fault_mode":"fis","action":"aws:network:disrupt-connectivity","evidence_required":["Client connection/request failures; retry count; buffered work; actual affected paths; post-recovery transaction results."],"acceptance":"The selected path is measurably impaired; R_max holds; accepted work is reconciled and Q_age recovers within T_restore.","recovery":"Verify network restoration and fresh service requests from the affected workload. Reconcile buffered operations.","limitations":["A subnet fault does not make S3 or DynamoDB unavailable globally. It may not affect a managed service\u2019s separate execution path.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"NET-02","revision":1,"title":"SQS access through a VPC interface endpoint","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Dependency","hypothesis":"A producer or consumer recovers when its SQS interface endpoint becomes unreachable.","procedure":"Prove the test application uses the selected endpoint and has no alternate route that bypasses the test. Record endpoint security groups and submit numbered messages.","fault_mode":"fis","action":"aws:network:disrupt-vpc-endpoint","evidence_required":["Send/receive errors; endpoint path; retries; oldest message age; dead-letter records; processed message IDs."],"acceptance":"The endpoint fault reaches the intended client; every accepted message has one business outcome; Q_age recovers within T_restore.","recovery":"Verify the original security groups and successful send/receive calls, then reconcile queue and dead-letter records.","limitations":["This is endpoint access loss, not an SQS service outage. Freeze conflicting endpoint changes during the test.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"NET-03","revision":1,"title":"Availability Zone impairment scenario","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Availability zone","hypothesis":"Resources outside the selected AZ can carry the approved workload during the simulated impairment.","procedure":"Map the AWS scenario to the actual topology. List affected and unaffected resources, confirm survivor capacity, and rehearse each constituent action first.","fault_mode":"external","action":"AWS scenario: AZ Availability: Power Interruption","evidence_required":["Client success/latency; traffic by AZ; surviving capacity; database/storage events; failed scale-out; data ledger."],"acceptance":"E_max, L_max and data invariants hold at the approved load; all required recovery steps finish by T_restore.","recovery":"Reconcile every changed resource and network setting, restore capacity, verify data/replication, and run fresh cross-AZ transactions.","limitations":["The scenario produces selected symptoms. It does not shut down an AWS AZ or prove that every Fargate/Lambda dependency was affected.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/az-availability-scenario.html","https://docs.aws.amazon.com/fis/latest/userguide/scenario-library.html"],"assertions":[]}},{"id":"NET-04","revision":1,"title":"Cross-Region connectivity impairment","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Disaster recovery","hypothesis":"The application follows its defined routing and data policy when a selected inter-Region path fails.","procedure":"Identify traffic direction, replication paths and client entry points. Use probes in both Regions; preserve route/replication settings and approve a failback procedure.","fault_mode":"external","action":"AWS scenario: Cross-Region: Connectivity","evidence_required":["Failures in each direction; routing changes; regional writes; replication lag; recovery time; conflicting or missing records."],"acceptance":"Affected journeys recover within the stated RTO; recovered data satisfies RPO and conflict rules; unaffected paths remain correctly classified.","recovery":"Restore connectivity, verify convergence and perform failback only after the required data and routing checks.","limitations":["This is a path/replication impairment scenario, not a complete regional outage. Record managed-service and inbound paths it does not affect.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/cross-region-scenario.html","https://docs.aws.amazon.com/fis/latest/userguide/multi-account.html"],"assertions":[]}},{"id":"NET-05","revision":1,"title":"Direct Connect virtual-interface failure","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Network","hypothesis":"Hybrid application traffic moves to the intended backup link when the selected BGP path fails.","procedure":"Confirm alternate routing and out-of-band operator access. Select the VIF and supported duration; coordinate both network teams.","fault_mode":"fis","action":"aws:directconnect:virtual-interface-disconnect","evidence_required":["BGP state; selected routes; packet loss; backup-link utilization; application-session recovery."],"acceptance":"The approved backup path carries critical traffic within T_restore without exceeding its capacity or E_max.","recovery":"Verify intended BGP sessions and route preferences, then test a fresh end-to-end application session.","limitations":["A BGP failover test does not reproduce every physical circuit failure. Avoid provider maintenance windows.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_failover.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"NET-06","revision":1,"title":"ARC zonal autoshift","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Availability zone","hypothesis":"Eligible resources can move traffic away from one AZ without exhausting the remaining capacity.","procedure":"Select an eligible resource with zonal autoshift enabled and a target AZ. Confirm the required ARC configuration, available capacity outside that AZ and the initial traffic distribution.","fault_mode":"fis","action":"aws:arc:start-zonal-autoshift","evidence_required":["Traffic by AZ; residual traffic; survivor utilization; client success and latency; shift state."],"acceptance":"Traffic follows the intended shift and E_max/L_max hold for W_stable; ending the shift restores the intended routing.","recovery":"Confirm shift expiry/cancellation and check for another active shift before attributing residual routing to the test.","limitations":["This tests a recovery mechanism, not a fault. Eligibility belongs to the selected resource, not to the application\u2019s deployment label.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html","https://docs.aws.amazon.com/r53recovery/latest/dg/testing-zonal-autoshift-fis.html"],"assertions":[]}},{"id":"OPS-01","revision":1,"title":"Peak traffic during a component failure","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Capacity","hypothesis":"The service tolerates the selected failure at the load level used for capacity planning.","procedure":"Define arrival rate, request mix, payload sizes and writes. First prove the load generator sustains that profile, then apply one previously rehearsed fault.","fault_mode":"external","action":"k6/Locust + a model-appropriate FIS fault","evidence_required":["Offered and completed requests; errors by time window; latency; queue age; load-generator saturation; scaling events."],"acceptance":"The generator delivers the required profile; E_max, L_max and Q_age hold; serving capacity returns within T_restore.","recovery":"Stop test traffic, reconcile synthetic writes and restore test capacity. Preserve separate baseline, fault and recovery measurements.","limitations":["A falling request rate can conceal overload. Do not claim a pass from latency alone when the generator stopped supplying the intended load.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://grafana.com/docs/k6/latest/using-k6/thresholds/","https://docs.locust.io/en/stable/what-is-locust.html","https://docs.aws.amazon.com/fis/latest/userguide/what-is.html"],"assertions":[]}},{"id":"OPS-02","revision":1,"title":"Failed deployment and rollback","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Operations","hypothesis":"The release controls detect a faulty version and restore service without a schema or data regression.","procedure":"Introduce one reversible fault in a canary release. Record the known-good artifact, traffic split, rollback trigger and schema compatibility.","fault_mode":"external","action":"Deployment pipeline + controlled faulty canary","evidence_required":["Version serving each request; detection; rollback decision/start/end; client recovery; writes made by each version."],"acceptance":"The correct version is restored by T_restore; expected detection/notification meet T_alert; schema and business-data checks pass.","recovery":"Verify code, configuration and traffic allocation, then reconcile writes from the faulty version.","limitations":["The deployment system supplies this fault. FIS has no universal action for a bad application release.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/what-is.html","https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html"],"assertions":[]}},{"id":"OPS-03","revision":1,"title":"Telemetry or notification-path failure","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Observability","hypothesis":"An independent monitor detects loss of the primary monitoring or notification path.","procedure":"Disable one test collector or notification route. Keep the experiment\u2019s stop alarms and operator access on a different, verified path.","fault_mode":"external","action":"Controlled telemetry/notification-path impairment","evidence_required":["Last successful heartbeat; missing-data detection; alternate notification receipt; telemetry restoration and unrecoverable gaps."],"acceptance":"The alternate notification arrives within T_alert; missing data is marked unknown rather than healthy; a fresh signal passes end to end after restoration.","recovery":"Restore the collector/routing settings and verify metric, alert and notification delivery with a new test event.","limitations":["Do not disable the only safety alarm or emergency-control path to test observability.","Imported from the revised research catalogue. Numeric limits, target scope and execution approval are not supplied."],"source_urls":["https://docs.aws.amazon.com/fis/latest/userguide/monitoring-experiments.html","https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html"],"assertions":[]}},{"id":"OPS-04","revision":1,"title":"Supervised incident-response exercise","simulated":false,"kind":"scenario","data":{"status":"draft","models":["ec2","eks-ec2","eks-fargate","ecs-ec2","ecs-fargate","lambda"],"domain":"Operations","hypothesis":"The on-call team detects and mitigates the chosen fault using its actual incident procedure.","procedure":"Use a rehearsed fault under an approved exercise. Give a controller stop authority; specify responder briefing, escalation, exercise labels and real-incident override.","fault_mode":"external","action":"A selected technical fault + incident workflow","evidence_required":["Detection; delivered notification; acknowledgement; diagnosis; decisions; mitigation; recovery; communications; runbook steps."],"acceptance":"T_alert, T_ack and the recovery objective are met; the correct escalation and communication steps occur; mitigation causes no unapproved side effects.","recovery":"Verify service and data recovery, close the exercise incident, and assign each failed assertion a remediation owner and retest.","limitations":["An auto-recovered service does not prove the paging workflow. Test an expected notification explicitl async function hash(value){if(!crypto.subtle)return 'unavailable-in-this-browser';const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(stable(value)));return Array.from(new Uint8Array(b)).map(v=>v.toString(16).padStart(2,'0')).join('');}
function download(name,body,type='application/json'){const url=URL.createObjectURL(body instanceof Blob?body:new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function api(path,options={}){if(!state.token)throw new Error('Unlock the local service first.');const opts={method:options.method||'GET',headers:{'Authorization':'Bearer '+state.token},credentials:'omit'};if(options.body!==undefined){opts.headers['Content-Type']='application/json';opts.body=options.raw?options.body:JSON.stringify(options.body);}const response=await fetch('/api/'+path,opts);if(!response.ok){let message='Request failed ('+response.status+').';try{const error=await response.json();message=typeof error.detail==='string'?error.detail:JSON.stringify(error.detail,null,2);}catch(_){}throw new Error(message);}return options.blob?response.blob():response.json();}
async function refresh(){if(state.mode!=='service'||!state.unlocked)return;const [workspace,config]=await Promise.all([api('workspace'),api('config')]);state.entries=workspace.records;state.audit=workspace.audit;state.connections=config.connections;render();}
function latestSnapshots(){const latest=new Map();for(const e of records('snapshot')){const k=e.record.data.connection_id;const old=latest.get(k);if(!old||new Date(e.record.data.ended_at)>=new Date(old.record.data.ended_at))latest.set(k,e);}return Array.from(latest.values());}
function snapshotStatus(e){return e.record.data.coverage.some(c=>!['complete','not_requested'].includes(c.status))?'partial':'complete';}
function refButton(reference,label){return `<button class="text-link" data-action="detail" data-ref="${esc(reference)}">${esc(label||reference)}</button>`;}
function originBadge(e){return e.record.simulated?badge('simulated','Synthetic fixture'):badge(e.meta.origin,e.meta.origin==='evaluated'?'Computed here':e.meta.origin==='imported'?'Imported · unverified':e.meta.origin.replaceAll('-',' '));}
function pageHeading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panel-header"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>${action}</div>${body}</section>`;}
function empty(title,description,action=''){return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(description)}</p>${action}</div>`;}
function info(text,type=''){return `<div class="info ${type}">${text}</div>`;}
function stat(label,value,note){return `<div class="metric-card"><div class="metric-label">${esc(label)}</div><div class="metric-number">${esc(value)}</div><p>${esc(note)}</p></div>`;}
function filterFor(route){return state.filters[route]||(state.filters[route]={q:'',model:'all',status:'all'});}
function matches(entry,filter){const r=entry.record;if(filter.q&&!JSON.stringify(r).toLowerCase().includes(filter.q.toLowerCase()))return false;if(filter.model!=='all'&&!(r.data.models||[]).includes(filter.model))return false;return filter.status==='all'||r.data.status===filter.status||r.data.outcome===filter.status;}
function filters(route,count,models=true,statusOptions=[]){const f=filterFor(route);return `<div class="filter-bar"><div class="search-field"><input id="search-${route}" data-filter="q" type="search" placeholder="Search ${esc(route==='runs'?'execution records':route)}…" aria-label="Search ${esc(route)}" value="${esc(f.q)}"></div>${models?`<div class="filter-group"><label for="model-filter">Deployment</label><select id="model-filter" data-filter="model"><option value="all">All models</option>${Object.entries(MODEL_NAMES).map(([k,v])=>`<option value="${k}" ${f.model===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`:''}${statusOptions.length?`<div class="filter-group"><label for="status-filter">Status</label><select id="status-filter" data-filter="status"><option value="all">All statuses</option>${statusOptions.map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x.replaceAll('_',' ')}</option>`).join('')}</select></div>`:''}<span class="filter-count">${count} records</span></div>`;}
function renderNav(){let group='';$('#nav').innerHTML=ROUTES.map(([id,title,symbol,section])=>{let head='';if(section!==group){head=`<div class="nav-group-label">${section.toUpperCase()}</div>`;group=section;}const kind={scenarios:'scenario',runs:'execution_run',validations:'validation_run',reports:'report'}[id];return head+`<a class="nav-link ${state.route===id?'active':''}" href="#${id}" ${state.route===id?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${symbol}</span>${esc(title)}${kind?`<span class="nav-count">${records(kind).length}</span>`:''}</a>`;}).join('');}
function render(){const route=ROUTES.find(r=>r[0]===state.route)||ROUTES[0];state.route=route[0];renderNav();$('#breadcrumb-current').textContent=route[1];$('#connection-status').textContent=state.mode==='preview'?'Preview':state.unlocked?'Local service unlocked':'Local service locked';$('#connection-status').classList.toggle('live',state.mode==='service'&&state.unlocked);$('#unlock-button').textContent=state.mode==='preview'?'Local setup':state.unlocked?'Lock service':'Unlock service';$('#storage-label').textContent=state.mode==='preview'?'Browser preview · memory only':'Local SQLite · persistent volume';const bar=$('#mode-bar');bar.classList.toggle('service',state.mode==='service');bar.innerHTML=state.mode==='preview'?'<span><strong>INTERACTIVE PREVIEW</strong> · All inspections and incident records shown are synthetic. Changes stay in this tab.</span><button data-action="setup">Run locally</button>':`<span><strong>LOCAL SERVICE</strong> · ${state.unlocked?'Records persist in your local data volume. Fault execution is not implemented.':'Unlock to read or change the workspace. No AWS connection has been inferred.'}</span><button data-action="setup">Connection setup</button>`;const renderers={overview:overviewPage,connections:connectionsPage,inventory:inventoryPage,scenarios:scenariosPage,runs:runsPage,validations:validationsPage,reports:reportsPage,roadmap:roadmapPage,data:dataPage};$('#main').innerHTML=renderers[state.route]();}
function overviewPage(){const snaps=latestSnapshots(),vals=records('validation_run'),gaps=vals.flatMap(e=>e.record.data.checks||[]).filter(c=>c.outcome==='inconclusive').length;const boundary=panel('Execution boundary','What this build can change',`<div class="boundary-list"><div class="boundary-row"><span>Local records and reports</span>${badge('complete','Enabled')}</div><div class="boundary-row"><span>AWS and runtime resources</span>${badge('draft','Read only')}</div><div class="boundary-row"><span>FIS and local fault execution</span>${badge('not_assessed','Not implemented')}</div></div><p class="boundary-note">A completed collection is not a successful resilience test.</p>`);const modelRows=Object.entries(MODEL_NAMES).filter(([m])=>m!=='shared').map(([m,label])=>{const n=snaps.flatMap(e=>e.record.data.resources).filter(r=>r.model===m).length;return `<tr><td>${esc(label)}</td><td class="right mono">${n||'—'}</td><td>${badge(n?'imported':'not_assessed',n?(state.mode==='preview'?'Example records':'Inventory records'):'Not observed')}</td></tr>`;}).join('');const findings=vals.slice(-3).reverse().map(e=>`<div class="finding"><div class="finding-title">${refButton(e.meta.ref,e.record.title)}${badge(e.record.data.outcome)}</div><p>${(e.record.data.checks||[]).filter(c=>c.outcome!=='pass').map(c=>esc(c.title)+': '+esc(c.outcome)).join(' · ')||'Only the listed assertions were evaluated.'}</p></div>`).join('');return pageHeading('Local-first / inspection and evidence','Validation workspace','Inspect a configured environment, preserve what was observed, and evaluate explicit requirements against recorded evidence.',button('Import bundle','import','',true)+button('Connections →','route','data-route="connections"'))+`<div class="metrics">${stat('Latest environment snapshots',snaps.length,state.mode==='preview'?'Synthetic examples only':'One latest snapshot per connection')}${stat('Scenario revisions',records('scenario').length,'36 research drafts + specified examples')}${stat('Validation records',vals.length,'Not a deployment-wide verdict')}${stat('Missing evidence checks',gaps,'Counted across saved validations')}</div><div class="grid"><section class="goal-panel"><div class="eyebrow">CURRENT GATE</div><h2>Prove collection against a real environment.</h2><p>Confirm the account or runtime, collect the requested scopes, and verify that the snapshot survives restart and backup restore. Then specify an incident test. No operational-readiness claim is established by this workspace yet.</p>${button('Review next deliverable →','route','data-route="roadmap"')}</section>${boundary}</div><div class="pipeline"><a href="#scenarios"><span class="step-label">01 / DEFINE</span><strong>Scenario revisions</strong><small>Requirement, procedure, limits</small></a><a href="#runs"><span class="step-label">02 / RECORD</span><strong>Execution & evidence</strong><small>Exact scope and interval</small></a><a href="#validations"><span class="step-label">03 / EVALUATE</span><strong>Validation runs</strong><small>Pass, fail or inconclusive</small></a><a href="#reports"><span class="step-label">04 / REVIEW</span><strong>Frozen reports</strong><small>Inputs, conclusions and limits</small></a></div><div class="grid">${panel('Deployment coverage','Counts from the latest snapshots; not a completeness claim',`<div class="table-wrap"><table><thead><tr><th>Deployment model</th><th class="right">Resources</th><th>Evidence state</th></tr></thead><tbody>${modelRows}</tbody></table></div>`,button('Inspect inventory','route','data-route="inventory"',true))}<div>${panel('Findings requiring evidence','A failed assertion and absent evidence are different findings',`<div class="findings">${findings||'<div class="finding"><p>No validation has been evaluated. Import a run with evidence, or record an inventory collection check.</p></div>'}</div>`)}<div class="section-gap">${activityPanel(4)}</div></div></div>`;}
function activityPanel(limit){return panel('Workspace activity','Local audit entries; not a tamper-proof audit trail',`<div class="activity">${state.audit.slice(0,limit).map(a=>`<div class="activity-row"><span class="activity-mark"></span><div><strong>${esc(a.action.replaceAll('_',' '))}</strong><p>${esc(a.detail.connection_id||a.detail.note||(a.detail.records?`${a.detail.records.length} record decisions`:a.detail.format||''))}</p></div><time>${esc(shortDate(a.at))}</time></div>`).join('')||'<div class="activity-row"><p>No local activity is loaded.</p></div>'}</div>`);}
function connectionsPage(){const connections=state.connections.length?state.connections:[{id:'unconfigured-aws',name:'AWS account',kind:'aws',unconfigured:true},{id:'unconfigured-docker',name:'Local Docker engine',kind:'docker',unconfigured:true},{id:'unconfigured-podman',name:'Local Podman engine',kind:'podman',unconfigured:true},{id:'unconfigured-kubernetes',name:'Kubernetes namespace',kind:'kubernetes',unconfigured:true}];return pageHeading('Identity / scope / collection','Connections','Connections are named in the administrator configuration. The browser can invoke an allowed inspector, not supply credentials or arbitrary endpoints.',button('Setup instructions','setup','',true))+`<div class="connection-grid">${connections.map(c=>{const snap=latestSnapshots().find(e=>e.record.data.connection_id===c.id);let fields=c.kind==='aws'?[['Expected account',c.expected_account_id||'Not configured'],['Credential source',c.profile||'Backend credential chain'],['Regions',(c.regions||[]).join(', ')||'Not configured'],['Requested services',(c.services||[]).length?c.services.join(', '):'Not configured']]:c.kind==='kubernetes'?[['Context',c.context||(c.in_cluster?'In-cluster service account':'Not configured')],['Namespaces',(c.namespaces||[]).join(', ')||'Not configured'],['Allowed operations','List selected workload metadata'],['Excluded','Secrets, ConfigMaps, logs and exec']]:[['Transport','Administrator-configured Unix socket'],['Allowed requests','Version, containers, volumes, networks'],['Data excluded','Environments, logs and volume content'],['Authority warning','Raw socket access remains privileged']];return `<article class="connection-card"><div class="connection-card-header"><div class="provider-icon ${c.kind}">${c.kind==='kubernetes'?'K8S':c.kind==='docker'?'DCK':c.kind==='podman'?'POD':'AWS'}</div><div><h2>${esc(c.name)}</h2><p>${esc(c.id)}</p></div></div><div class="detail-grid">${fields.map(([k,v])=>`<div class="detail-item"><span class="label">${esc(k)}</span><span class="value">${esc(v)}</span></div>`).join('')}</div>${snap?`<div class="inline-list">${badge(snapshotStatus(snap),'Last collection: '+snapshotStatus(snap))}${originBadge(snap)}</div>`:badge('not_assessed','No collection recorded')}<div class="connection-card-footer"><p>${snap?esc(shortDate(snap.record.data.ended_at)):'Identity has not been verified.'}</p>${c.unconfigured?button('Configure','setup','',true):button(state.mode==='preview'?'View example':'Inspect connection',state.mode==='preview'?'connection-example':'inspect',`data-id="${esc(c.id)}"`,state.mode==='preview')}</div></article>`;}).join('')}</div><div class="section-gap">${info('<strong>Read-only means no write calls in these adapters—not reduced authority of the supplied credential or engine socket.</strong> Use a restricted AWS role and namespace RoleBindings. For Docker or Podman, an administrator-enforced read-only proxy provides a stronger boundary than this process’s request allowlist.','warning')}</div>`;}
function inventoryPage(){const f=filterFor('inventory');const snapshots=state.inventoryRef==='latest'?latestSnapshots():records('snapshot').filter(e=>e.meta.ref===state.inventoryRef);let resources=snapshots.flatMap(e=>e.record.data.resources.map(r=>({resource:r,snapshot:e})));resources=resources.filter(x=>(f.model==='all'||x.resource.model===f.model)&&(!f.q||JSON.stringify(x.resource).toLowerCase().includes(f.q.toLowerCase())));const shown=resources.slice(0,state.inventoryLimit);const cover=snapshots.flatMap(e=>e.record.data.coverage.map(c=>({c,e})));return pageHeading('Bounded collection / explicit gaps','Inventory','A snapshot preserves account identity, collection interval, requested scope and per-scope failures. It does not measure request handling or recovery.',button('Inspect a connection','route','data-route="connections"'))+`<div class="filter-bar"><div class="filter-group"><label for="snapshot-filter">Snapshot</label><select id="snapshot-filter" data-snapshot-select><option value="latest">Latest per connection</option>${records('snapshot').slice().reverse().map(e=>`<option value="${esc(e.meta.ref)}" ${state.inventoryRef===e.meta.ref?'selected':''}>${esc(e.record.title)} · ${esc(shortDate(e.record.data.ended_at))}</option>`).join('')}</select></div><span class="filter-count">${snapshots.length} snapshots selected</span></div>`+filters('inventory',resources.length,true)+(!snapshots.length?empty('No environment has been inspected','Configure a connection and run a read-only inspection, or import a snapshot bundle. Permission failures will appear as collection gaps.',button('Open connections','route','data-route="connections"')):`${panel('Collected resources',`Showing ${shown.length} of ${resources.length} matching resources`, `<div class="table-wrap"><table><thead><tr><th>Resource</th><th>Deployment</th><th>Location</th><th>Observed state</th><th>Source</th></tr></thead><tbody>${shown.map(({resource:r,snapshot:e})=>`<tr><td><button class="text-link cell-title" function scenariosPage(){const f=filterFor('scenarios');const list=records('scenario').filter(e=>matches(e,f));return pageHeading('Versioned requirements / no executable code','Scenarios','The inherited 36 scenarios remain drafts. A specified record has scalar assertions; it still does not authorize or execute a fault.',button('New definition','new-scenario','',true)+button('Import definitions','import'))+filters('scenarios',list.length,true,['draft','specified'])+panel('Scenario definitions','Every run references a fixed scenario revision',`<div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Deployment</th><th>Domain</th><th>Definition</th><th>Checks</th><th></th></tr></thead><tbody>${list.map(e=>{const r=e.record,d=r.data;return `<tr><td><button class="text-link cell-title" data-action="detail" data-ref="${esc(e.meta.ref)}">${esc(r.title)}</button><span class="cell-sub mono">${esc(r.id)} · rev ${r.revision}${r.simulated?' · SYNTHETIC':''}</span></td><td>${d.models.length>3?`<span class="badge">${d.models.length} models</span>`:tags(d.models)}</td><td>${esc(d.domain)}</td><td>${badge(d.status)}</td><td class="mono">${d.assertions.length||'—'}</td><td class="table-actions"><button class="button compact secondary" data-action="detail" data-ref="${esc(e.meta.ref)}">Inspect</button></td></tr>`;}).join('')||'<tr><td colspan="6">No definitions match this filter.</td></tr>'}</tbody></table></div>`);}
