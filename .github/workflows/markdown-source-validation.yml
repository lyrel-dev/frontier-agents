name: Validate Markdown authoring and review
on:
  push:
    branches: ['docs/markdown-source-review']
    paths: ['markdown-build.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markdown-documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          python -m pip install -r tools/docs/requirements.txt
          python -m playwright install chromium
      - name: Export Markdown sources when migrating
        run: |
          if [ ! -d content ]; then python tools/docs/migrate_markdown_once.py; fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/docs')
          from markdown_sources import Repository
          repo=Repository()
          for name,value in repo.registers().items():
              assert value==json.loads(Path('catalog',name+'.json').read_text()), name+' changed'
          print('Verified',len(repo.sources),'Markdown sources and all register values')
          PY
      - name: Build and validate
        run: |
          python -m compileall -q tools/docs
          python tools/docs/build.py
          python tools/docs/check.py --browser > /tmp/docs-check.log 2>&1 || { tail -n 100 /tmp/docs-check.log; exit 1; }
          if [ -f tools/docs/review_check.py ]; then python tools/docs/review_check.py; fi
      - name: Publish each changed document separately
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed={'content','guides','catalog','presentations','assets','qa','tools'}
          roots={'README.md','MANIFEST.json','VALIDATION.md','PUBLISHING.md','CHANGELOG.md','EDITORIAL_STANDARD.md','AUTHORING.md','index.html'}
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all'])
          paths=[]
          for row in raw.split(b'\0'):
              if not row: continue
              status=row[:2].decode();path=row[3:].decode()
              if 'R' in status or 'C' in status: raise SystemExit('Review rename separately: '+path)
              if Path(path).parts[0] not in allowed and path not in roots: raise SystemExit('Unexpected output: '+path)
              paths.append(path)
          for path in sorted(set(paths)):
              subprocess.run(['git','add','--',path],check=True)
              subprocess.run(['git','commit','-m','docs: compile '+path],check=True,stdout=subprocess.DEVNULL)
          print('Committed',len(paths),'source/document outputs')
          PY
          git push origin HEAD:"$TARGET_BRANCH"
