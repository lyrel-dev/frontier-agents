name: Verify atomic trial finalization once
on:
  push:
    branches: [feat/aws-fis-console-delivery]
    paths: [.github/workflows/console-finalization-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/feat/aws-fis-console-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: applications/aws-validation-console/agent_lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed local transaction correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,before,after,transform):
              p=Path(name);raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==before,name+' baseline differs'
              changed=transform(raw.decode())
              assert hashlib.sha256(changed.encode()).hexdigest()==after,name+' result differs'
              p.write_text(changed)
          def create(name,sha,content):
              p=Path(name);assert not p.exists(),name+' already exists'
              assert hashlib.sha256(content.encode()).hexdigest()==sha,name+' content differs'
              p.write_text(content)
          def engine(s):
              return s.replace("            self.store.update(tid,state=final,changes={'closed_at':iso(now)},event='trial.closed')\n            evaluate_trial(self.store,tid,binding)","            evaluate_trial(self.store,tid,binding,final_state=final,closed_at=iso(now))")
          def evaluator(s):
              s=s.replace("def evaluate_trial(store, trial_id, binding):\n    trial=store.entity(trial_id); data=trial['data']", """def evaluate_trial(store, trial_id, binding, *, final_state=None, closed_at=None):
              trial=store.entity(trial_id)
              revision=trial['revision']
              if final_state is not None:
                  if trial['state']!='FINALIZING' or final_state not in {'CLOSED','CLOSED_ABORTED'} or not closed_at:
                      raise Blocked('Invalid finalization request')
                  # Evaluate the intended final state without publishing it to readers yet.
                  trial={**trial,'state':final_state,'data':{**trial['data'],'closed_at':closed_at}}
              data=trial['data']""")
              return s.replace("    record=store.put_record('assessment',trial_id,body)","""    if final_state is not None:
                  from .finalization import finalize_trial
                  return finalize_trial(store,trial_id,body,expected_revision=revision,state=final_state,closed_at=closed_at)
              record=store.put_record('assessment',trial_id,body)""")
          create('lab/finalization.py','73977065be7518d6d806e6af706379de9e08bacf0c885fc57c9f020750e248e9','''"""Publish a terminal trial and its assessment in one local transaction.
          
          Captured inputs can be committed earlier. A crash while computing the result
          leaves FINALIZING recoverable; readers never see a new closed trial without its
          assessment. This does not combine AWS writes with the local SQLite transaction.
          """
          from __future__ import annotations
          import json
          from .util import Blocked, canonical, digest, iso, uid
          
          
          def finalize_trial(store, trial_id, assessment, *, expected_revision, state, closed_at):
              if state not in {'CLOSED', 'CLOSED_ABORTED'}:
                  raise Blocked('Unsupported terminal trial state')
              if assessment.get('trial_id') != trial_id or assessment.get('lifecycle') != state:
                  raise Blocked('Final assessment identity or lifecycle mismatch')
              identifier = uid('assessment')
              at, sha = iso(), digest(assessment)
              with store.transaction() as db:
                  row = db.execute('SELECT * FROM entities WHERE id=?', (trial_id,)).fetchone()
                  if not row or row['kind'] != 'trial' or row['state'] != 'FINALIZING':
                      raise Blocked('Trial is not awaiting finalization')
                  if row['revision'] != expected_revision:
                      raise Blocked('Trial changed while its assessment was computed; retry finalization')
                  data = json.loads(row['data'])
                  expected_state = 'CLOSED_ABORTED' if data.get('aborted') else 'CLOSED'
                  if state != expected_state or data.get('cleanup_verified') is not True:
                      raise Blocked('Final state or restoration verification mismatch')
                  capture_id = assessment.get('probe_capture_id')
                  capture = db.execute('SELECT kind,owner,sha256 FROM records WHERE id=?', (capture_id,)).fetchone()
                  if (not capture or capture['kind'] != 'probe_capture' or capture['owner'] != trial_id
                          or assessment.get('input_hashes', {}).get(capture_id) != capture['sha256']):
                      raise Blocked('Final assessment must pin this trial\\'s probe capture')
                  db.execute('INSERT INTO records VALUES(?,?,?,?,?,?)',
                             (identifier, 'assessment', trial_id, at, sha, canonical(assessment)))
                  store._event(db, trial_id, 'record.saved', {'id':identifier,'kind':'assessment','sha256':sha})
                  changes = {'closed_at':closed_at,'assessment_id':identifier}
                  data.update(changes)
                  db.execute('UPDATE entities SET state=?,revision=revision+1,updated_at=?,data=? WHERE id=?',
                             (state, at, canonical(data), trial_id))
                  store._event(db, trial_id, 'trial.closed', {'from':'FINALIZING','to':state,'changes':changes})
                  store._event(db, trial_id, 'trial.assessed', {'assessment_id':identifier})
              return store.record(identifier)
          ''')
          create('tests/test_finalization.py','944ea6ac272e83ad4be1212374d3da211cb14e80aa1ece490356e702cee95fd9','''"""Terminal publication and crash recovery; fixtures never access AWS."""
          import pytest
          from lab.finalization import finalize_trial
          from lab.store import Store
          from lab.util import Blocked, iso
          from conftest import run_trial
          
          
          def pending(store, *, aborted=False):
              trial=store.create('trial','FINALIZING',{'cleanup_verified':True,'aborted':aborted})
              capture=store.put_record('probe_capture',trial['id'],{'samples':[]})
              state='CLOSED_ABORTED' if aborted else 'CLOSED'
              body={'trial_id':trial['id'],'lifecycle':state,'probe_capture_id':capture['id'],
                    'input_hashes':{capture['id']:capture['sha256']}}
              return trial,body,state
          
          
          @pytest.mark.parametrize('aborted',[False,True])
          def test_terminal_state_is_visible_only_with_its_pinned_assessment(store,monkeypatch,aborted):
              trial,body,state=pending(store,aborted=aborted)
              reader=Store(store.directory);event=store._event
              observed=[]
              def inspect_before_commit(db,owner,kind,data):
                  event(db,owner,kind,data)
                  if kind=='trial.closed':
                      observed.append(reader.entity(owner))
                      assert reader.records(owner,kind='assessment')==[]
              monkeypatch.setattr(store,'_event',inspect_before_commit)
              result=finalize_trial(store,trial['id'],body,expected_revision=trial['revision'],state=state,closed_at=iso())
              assert observed[0]['state']=='FINALIZING' and 'assessment_id' not in observed[0]['data']
              closed=reader.entity(trial['id'])
              assert closed['state']==state and closed['data']['assessment_id']==result['id']
              assert reader.record(result['id'])['data']==body
          
          
          def test_failed_commit_rolls_back_result_and_terminal_state(store,monkeypatch):
              trial,body,state=pending(store);event=store._event
              def fail(db,owner,kind,data):
                  event(db,owner,kind,data)
                  if kind=='trial.closed':raise RuntimeError('Injected precommit failure')
              monkeypatch.setattr(store,'_event',fail)
              with pytest.raises(RuntimeError,match='precommit'):
                  finalize_trial(store,trial['id'],body,expected_revision=trial['revision'],state=state,closed_at=iso())
              assert store.entity(trial['id'])==trial and store.records(trial['id'],kind='assessment')==[]
              monkeypatch.setattr(store,'_event',event)
              result=finalize_trial(store,trial['id'],body,expected_revision=trial['revision'],state=state,closed_at=iso())
              assert store.entity(trial['id'])['data']['assessment_id']==result['id']
          
          
          @pytest.mark.parametrize('change',['revision','capture','cleanup','lifecycle'])
          def test_stale_or_invalid_finalization_cannot_close_the_trial(store,change):
              trial,body,state=pending(store)
              if change=='revision':store.update(trial['id'],changes={'concurrent':True})
              if change=='capture':body['probe_capture_id']='nonexistent'
              if change=='cleanup':store.update(trial['id'],changes={'cleanup_verified':False});trial=store.entity(trial['id'])
              if change=='lifecycle':body['lifecycle']='CLOSED_ABORTED'
              with pytest.raises(Blocked):
                  finalize_trial(store,trial['id'],body,expected_revision=trial['revision'],state=state,closed_at=iso())
              assert store.entity(trial['id'])['state']=='FINALIZING' and store.records(trial['id'],kind='assessment')==[]
          
          
          def test_restart_resumes_finalization_without_a_second_provider_start(rig,monkeypatch):
              class Interrupted(BaseException):pass
              original=finalize_trial
              def interrupt(*args,**kwargs):raise Interrupted('Process lost before final commit')
              monkeypatch.setattr('lab.finalization.finalize_trial',interrupt)
              with pytest.raises(Interrupted):run_trial(rig)
              trial=rig['store'].entities('trial')[0]
              assert trial['state']=='FINALIZING' and not trial['data'].get('assessment_id')
              assert sum(w[2]=='start_experiment' for w in rig['world'].writes)==1
              monkeypatch.setattr('lab.finalization.finalize_trial',original)
              from lab.engine import Engine
              recovered=Engine(rig['config'],Store(rig['store'].directory),aws_factory=rig['world'].factory,clock=rig['clock'])
              recovered.step()
              trial=rig['store'].entity(trial['id'])
              assert trial['state']=='CLOSED'
              assert rig['store'].record(trial['data']['assessment_id'])['data']['lifecycle']=='CLOSED'
              assert sum(w[2]=='start_experiment' for w in rig['world'].writes)==1
          ''')
          edit('lab/engine.py','d5973751fc264e55ec3df8b29a91d471196ff31c2a6716fb23a8b23dbd96efdd','c54ac6c2ff1b16f20204577fa24a590ec94a4daf1c79dd978df7392490aa8358',engine)
          edit('lab/evaluation.py','3c3f9353406949b8789d5d3a482d9353dd783087570dc4bbbe13c718df1b1e16','42124d1f67346b15fbe14c1bd188944001e838e6ce2a32f6827d823f09b116b5',evaluator)
          PY
      - name: Verify regression suite without AWS
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python build_assets.py
          python -m pytest -q --junitxml=validation/finalization-pytest.xml
          git diff --check
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-finalization-tests
          path: applications/aws-validation-console/agent_lab/validation/finalization-pytest.xml
          retention-days: 7
      - name: Publish only verified application sources
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add applications/aws-validation-console/agent_lab/lab/engine.py applications/aws-validation-console/agent_lab/lab/evaluation.py applications/aws-validation-console/agent_lab/lab/finalization.py applications/aws-validation-console/agent_lab/tests/test_finalization.py
          git diff --cached --check
          git commit -m 'fix(console): atomically close trials with their pinned assessments'
          git push origin HEAD:feat/aws-fis-console-delivery
