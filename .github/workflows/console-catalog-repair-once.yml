name: Verify catalogue refresh repair once
on:
  push:
    branches: [feat/aws-fis-console-delivery]
    paths: [.github/workflows/console-catalog-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/feat/aws-fis-console-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: applications/aws-validation-console/agent_lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed filter-state correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,before,after,transform):
              p=Path(name);raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==before,name+' baseline differs'
              changed=transform(raw.decode())
              assert hashlib.sha256(changed.encode()).hexdigest()==after,name+' result differs'
              p.write_text(changed)
          def app(s):
              s=s.replace("benchmark:null,generation:0,offline:","benchmark:null,generation:0,catalogSearch:'',catalogScope:'',offline:")
              s=s.replace("fleetState.benchmark=null;renderAWS();}","fleetState.benchmark=null;fleetState.catalogSearch='';fleetState.catalogScope='';renderAWS();}")
              s=s.replace("filters.append(search,account);host.append(filters);", "search.value=fleetState.catalogSearch;account.value=fleetState.catalogScope;filters.append(search,account);host.append(filters);")
              return s.replace("search.oninput=draw;account.onchange=draw;draw();", "search.oninput=()=>{fleetState.catalogSearch=search.value;draw();};account.onchange=()=>{fleetState.catalogScope=account.value;draw();};draw();")
          def tests(s):
              needle="                check('search filters actual template records',page.get_by_role('button',name='Inspect AWS definition',exact=True).count()==1)"
              addition='''
                          page.evaluate("""()=>{const original=window.fetch;let release;
                            const held=new Promise(resolve=>release=resolve);
                            window.__releaseFilterRefresh=()=>{release();window.fetch=original};
                            window.fetch=async(path,options)=>{const response=await original(path,options);if(path==='/api/fis/catalog')await held;return response};
                            window.__filterRefresh=ar();
                          }""")
                          page.get_by_label('Filter FIS templates').fill('EXTtest')
                          page.evaluate('async()=>{window.__releaseFilterRefresh();await window.__filterRefresh;}')
                          check('a delayed catalogue refresh preserves the current operator search',
                                page.get_by_label('Filter FIS templates').input_value()=='EXTtest' and
                                page.get_by_role('button',name='Inspect AWS definition',exact=True).count()==1)
          '''
              assert needle in s
              return s.replace(needle,needle+addition)
          edit('static/aws.js','8f3d8617bc8002448e89b66a5e99214f799fe0d3a60b1c3f14c571272966b11d','60305643debb22ffbf22bd7c18278903f50a1cc6e665ffb1ddbac519218266ab',app)
          edit('tests/fis_browser_checks.py','08f74a1ee0e81018ec0c31ee9ba71e0395b4f7a68d71468c900b98dc91cc4768','47ece28380480b0f7fe7d5fccfd5f4e729adccd86e80fc2be608fddb47261fa7',tests)
          PY
      - name: Install test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Verify native catalogue and actual observability servers
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python build_assets.py
          python tests/fis_browser_checks.py --native
          python tests/observability_acceptance.py
          git diff --check
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-observability-repair
          path: applications/aws-validation-console/agent_lab/validation/
          retention-days: 7
      - name: Publish only verified application sources
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add applications/aws-validation-console/agent_lab/static/aws.js applications/aws-validation-console/agent_lab/tests/fis_browser_checks.py
          git diff --cached --check
          git commit -m 'fix(console): retain operator catalogue filters across refresh'
          git push origin HEAD:feat/aws-fis-console-delivery
