name: Apply exact native acceptance corrections once
on:
  push:
    branches: [feat/aws-fis-console-acceptance]
    paths: [.github/workflows/fis-console-native-fixes.yml]
permissions:
  contents: write
concurrency:
  group: fis-native-corrections
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'lyrel-dev/frontier-agents' && github.ref == 'refs/heads/feat/aws-fis-console-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply exact reviewed application edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,bz2,hashlib,json,os,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          req=urllib.request.Request('https://api.github.com/repos/lyrel-dev/frontier-agents/git/blobs/4cb5485e89616b84ca68aef4478b56a24779a064',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          compressed=base64.b64decode(data['content'])
          assert sha(compressed)=='2ef37a68dffcca9c7aec197abab86c77b76390c05cbf77bbe550596cf53add50'
          raw=bz2.decompress(compressed)
          assert sha(raw)=='9b3809f8c43af236c488117d9914f92dec982f17deba24db2a24f619dc8943c4'
          payload=json.loads(raw)
          expected={'applications/aws-validation-console/agent_lab/'+p for p in ['static/setup.js','tests/setup_browser_checks.py','tests/observability_acceptance.py']}
          assert {i['path'] for i in payload['files']}==expected and len(payload['files'])==3
          outputs=[]
          for item in payload['files']:
              path=Path(item['path']);before=path.read_bytes()
              if path.name=='setup_browser_checks.py':
                  assert sha(before)=='59274b3edd8a1189cd9e500243c9ab8dd9756516b319efa2afda56d9af622486'
                  text=before.decode();before=(text[:17710]+' '+text[17710:]).encode()
              assert sha(before)==item['before'],('before',str(path))
              text=before.decode();last=len(text)
              for start,end,replacement in reversed(item['edits']):
                  assert 0<=start<=end<=last
                  text=text[:start]+replacement+text[end:];last=start
              assert sha(text.encode())==item['after'],('after',str(path))
              outputs.append((path,text))
          for path,text in outputs:path.write_text(text)
          print('Applied three exact source corrections. No AWS access.')
          PY
      - name: Build and test without AWS
        working-directory: applications/aws-validation-console/agent_lab
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python build_assets.py
          python -m pytest -q
          git diff --check
      - name: Commit only reviewed application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- applications/aws-validation-console/agent_lab/static/setup.js applications/aws-validation-console/agent_lab/tests/setup_browser_checks.py applications/aws-validation-console/agent_lab/tests/observability_acceptance.py
          git commit -m 'fix(fis-console): gate form rendering on current reads and test telemetry within isolated network'
          git push origin HEAD:feat/aws-fis-console-acceptance
