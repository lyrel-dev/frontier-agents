name: Verify and apply setup navigation repair once
on:
  push:
    branches: [feat/aws-fis-console-delivery]
    paths: [.github/workflows/console-setup-repair-once.yml]
permissions:
  contents: write
concurrency:
  group: console-setup-repair-once
  cancel-in-progress: true
jobs:
  repair:
    if: github.ref == 'refs/heads/feat/aws-fis-console-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: applications/aws-validation-console/agent_lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed source transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name, before, after, transform):
              p=Path(name);raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==before, name+' baseline differs'
              changed=transform(raw.decode())
              assert hashlib.sha256(changed.encode()).hexdigest()==after, name+' result differs'
              p.write_text(changed)
          def ui(s):
              s=s.replace("navigation:0,loading:false,offline:","navigation:0,loading:false,session:0,offline:")
              s=s.replace("async function sf(path,body,token=setupState.token){if(setupState.offline)","async function sf(path,body,token=setupState.token){const session=setupState.session;if(setupState.offline)")
              s=s.replace("if(!r.ok)throw Error(value.error||JSON.stringify(value.detail||value));return value;}","if(session!==setupState.session||!setupState.token)throw Error('Session locked; discard the pending response.');if(!r.ok)throw Error(value.error||JSON.stringify(value.detail||value));return value;}")
              s=s.replace("token.input.value='';close();await load();render();message('Recorded: '","token.input.value='';await load();render();close();message('Recorded: '")
              s=s.replace("setupState.navigation++;setupState.loading=false;setupState.token='';", "setupState.navigation++;setupState.session++;setupState.loading=false;setupState.token='';")
              s=s.replace("try{setupState.token=token.get();await load();", "try{setupState.session++;setupState.token=token.get();await load();")
              s=s.replace("setupState.token=token||'';setupState.exit=", "setupState.session++;setupState.token=token||'';setupState.exit=")
              s=s.replace("let reads={};sf('setup/read-operations').then(r=>{reads=r;}).catch(e=>message(e.message,true));",'let reads={};')
              s=s.replace("params=se('div');let editor=null;\nsvc.input.onchange=", "params=se('div');let editor=null,shapeRequest=0;\nconst clearParameters=()=>{shapeRequest++;editor=null;params.replaceChildren();};\nop.input.onchange=clearParameters;\nsvc.input.onchange=")
              s=s.replace("editor=null;params.replaceChildren();};const loadShape=button('Build resource parameter fields',async()=>{const shape=await sf('setup/read-shape/'+svc.get()+'/'+op.get());editor=sdkValue(shape,'Parameters');params.replaceChildren(editor.node);});", """clearParameters();};const loadShape=button('Build resource parameter fields',async()=>{
            const service=svc.get(),operation=op.get(),request=++shapeRequest;
            if(!service||!operation)throw Error('Choose a loaded AWS read service and operation first.');
            const shape=await sf('setup/read-shape/'+service+'/'+operation);
            if(request!==shapeRequest||service!==svc.get()||operation!==op.get())return;
            editor=sdkValue(shape,'Parameters');params.replaceChildren(editor.node);
          });""")
              return s.replace("verifierSection.append(verifierHost,button('Add independent check',addVerifier));form.append(verifierSection);", """const addCheck=button('Add independent check',addVerifier);addCheck.disabled=true;
          const readStatus=se('p','Loading available AWS read operations…','setup-muted');
          const loadReads=async()=>{
            addCheck.disabled=true;readStatus.textContent='Loading available AWS read operations…';
            try{
              const received=await sf('setup/read-operations');
              if(!received||!Object.keys(received).length||!Object.values(received).every(v=>Array.isArray(v)&&v.length))throw Error('No usable AWS read-operation catalogue returned.');
              reads=received;addCheck.disabled=false;readStatus.textContent='AWS read operations loaded. Parameters are invalidated when their operation changes.';
            }catch(error){readStatus.textContent='Read operations unavailable. Retry without discarding the plan.';throw error;}
          };
          verifierSection.append(verifierHost,readStatus,addCheck,button('Reload read operations',loadReads));form.append(verifierSection);
          loadReads().catch(error=>message(error.message,true));""")
          def browser(s):
              old="""                    page.locator('[data-stage=accounts]').click();page.get_by_label('Connection ID',exact=True).fill(cid)
                              page.get_by_label('Connection label',exact=True).fill('Test-only '+cid)
                              page.get_by_label('Expected 12-digit AWS account',exact=True).fill(account)
                              page.get_by_label('Regions, comma separated',exact=True).fill('eu-central-1')
                              page.get_by_label('Observer profile',exact=True).select_option(profile)
                              if cid=='work':page.get_by_label('FIS executor profile (optional)',exact=True).select_option('test-executor')
                              page.get_by_role('button',name='Review account configuration',exact=True).click()"""
              new="""                    def fill_account():
                                  page.locator('[data-stage=accounts]').click();page.get_by_label('Connection ID',exact=True).fill(cid)
                                  page.get_by_label('Connection label',exact=True).fill('Test-only '+cid)
                                  page.get_by_label('Expected 12-digit AWS account',exact=True).fill(account)
                                  page.get_by_label('Regions, comma separated',exact=True).fill('eu-central-1')
                                  page.get_by_label('Observer profile',exact=True).select_option(profile)
                                  if cid=='work':page.get_by_label('FIS executor profile (optional)',exact=True).select_option('test-executor')
                              fill_account()
                              if cid=='work':
                                  page.evaluate(\"\"\"()=>{const original=window.fetch;let release;
                                    const held=new Promise(resolve=>release=resolve);window.__draftResponseReady=false;
                                    window.__releaseDraftResponse=()=>{release();window.fetch=original};
                                    window.fetch=async(path,options)=>{const response=await original(path,options);
                                      if(path==='/api/setup/accounts'){window.__draftResponseReady=true;await held}return response};
                                  }\"\"\")
                                  page.get_by_role('button',name='Review account configuration',exact=True).click()
                                  wait_state(page, 'window.__draftResponseReady')
                                  page.locator('#setup-auth').click()
                                  page.evaluate('window.__releaseDraftResponse()')
                                  page.wait_for_timeout(200)
                                  check('late account proposal response cannot restore private setup state after locking',
                                        page.evaluate(\"GuidedSetup.state().draft===null&&GuidedSetup.state().current===null&&GuidedSetup.state().token===''\"))
                                  page.get_by_role('button',name='Unlock',exact=True).click()
                                  page.get_by_label('Local operator token',exact=True).fill(OP)
                                  page.locator('#setup-modal').get_by_role('button',name='Unlock',exact=True).click()
                                  wait_state(page, 'GuidedSetup.state().current!==null')
                                  fill_account()
                              page.get_by_role('button',name='Review account configuration',exact=True).click()"""
              assert old in s;s=s.replace(old,new)
              anchor="                page.locator('[data-stage=plan]').click();page.get_by_label('Plan / binding ID',exact=True).wait_for()"
              new="""                page.evaluate(\"\"\"()=>{const original=window.fetch;let release;
                            const held=new Promise(resolve=>release=resolve);
                            window.__releaseReadCatalogue=()=>{release();window.fetch=original};
                            window.fetch=async(path,options)=>{if(path==='/api/setup/read-operations')await held;return original(path,options)};
                          }\"\"\")
          """+anchor+"""
                          check('cannot add an unusable verifier before the read-operation catalogue loads',
                                page.get_by_role('button',name='Add independent check',exact=True).is_disabled())
                          page.evaluate('window.__releaseReadCatalogue()')
                          wait_state(page, \"!document.querySelector('#setup-content button').disabled && [...document.querySelectorAll('button')].some(b=>b.textContent==='Add independent check'&&!b.disabled)\")
          """
              assert anchor in s;s=s.replace(anchor,new)
              old="                    box.get_by_label('Read operation',exact=True).select_option('describe_instances');box.get_by_role('button',name='Build resource parameter fields',exact=True).click()"
              new="""                    box.get_by_label('Read operation',exact=True).select_option('describe_instances')
                              if phase=='baseline':
                                  page.evaluate(\"\"\"()=>{const original=window.fetch;let release;
                                    const held=new Promise(resolve=>release=resolve);
                                    window.__releaseReadShape=()=>{release();window.fetch=original};
                                    window.fetch=async(path,options)=>{if(path==='/api/setup/read-shape/ec2/describe_instances')await held;return original(path,options)};
                                  }\"\"\")
                                  box.get_by_role('button',name='Build resource parameter fields',exact=True).click()
                                  box.get_by_label('Read operation',exact=True).select_option('describe_volumes')
                                  page.evaluate('window.__releaseReadShape()')
                                  wait_state(page, \"[...document.querySelectorAll('button')].some(b=>b.textContent==='Build resource parameter fields'&&!b.disabled)\")
                                  check('late SDK shape response cannot attach parameters to a different operation',
                                        box.get_by_label('Add Parameters field',exact=True).count()==0)
                                  box.get_by_label('Read operation',exact=True).select_option('describe_instances')
                              box.get_by_role('button',name='Build resource parameter fields',exact=True).click()"""
              assert old in s;s=s.replace(old,new)
              needle="                    box.get_by_label('JMESPath response field',exact=True).fill('Reservations[0].Instances[0].State.Name')"
              new="""                    if phase=='baseline':
                                  box.get_by_label('Read operation',exact=True).select_option('describe_volumes')
                                  check('changing the verifier operation invalidates existing resource parameters',
                                        box.get_by_label('InstanceIds item',exact=True).count()==0)
                                  box.get_by_label('Read operation',exact=True).select_option('describe_instances')
                                  box.get_by_role('button',name='Build resource parameter fields',exact=True).click()
                                  box.get_by_label('Add Parameters field',exact=True).select_option('InstanceIds')
                                  box.get_by_role('button',name='Add selected field',exact=True).click()
                                  box.get_by_role('button',name='Add InstanceIds item',exact=True).click()
                                  box.get_by_label('InstanceIds item',exact=True).fill('i-123')
          """+needle
              assert needle in s;return s.replace(needle,new)
          edit('static/setup.js','c67453f5180528e83bcb252e724c5f2139091c48de6cba12b5ef9bf85dba72af','37e9a2fa5c283ea7b717479473b7ed5356bebcddbf13b5ff51b7ddc195ee1beb',ui)
          edit('tests/setup_browser_checks.py','4430cd52939353faba4a981c394fdce229ec8386da86837c5590b7165cac2ff9','56d8868a7334349972e1251d8da3b173eeb2bca4d31628153039915375509f67',browser)
          PY
      - name: Install Python and browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Verify Python and actual native setup navigation
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python build_assets.py
          python -m pytest -q
          python tests/native_setup_diagnostics.py
          git diff --check
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-navigation-repair
          path: applications/aws-validation-console/agent_lab/validation/
          retention-days: 7
      - name: Publish only verified application sources
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add applications/aws-validation-console/agent_lab/static/setup.js applications/aws-validation-console/agent_lab/tests/setup_browser_checks.py
          git diff --cached --check
          git commit -m 'fix(console): guard setup sessions and operation-specific verifier parameters'
          git push origin HEAD:feat/aws-fis-console-delivery
