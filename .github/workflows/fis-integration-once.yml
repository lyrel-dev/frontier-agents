          "applications/aws-validation-console/agent_lab/lab/service.py":{"before":"5b66f050499b3070c8b68208532ee55499eabe06541a40a813cb1c73699a5307","after":"e5883da639189e23d7c5bd7dbc3ba1759b1d865a154d7b4bbd43f9afc5b1ecdc","edits":[[43,44,"    def trial(self,request:TrialRequest, *, entity_id=None):\n"],[51,51,"        if entity_id is not None:\n            try:\n                old = self.store.entity(entity_id)\n            except KeyError:\n                old = None\n            if old:\n                if (old['kind'] != 'trial' or old['data']['experiment_ref'] != request.experiment_ref\n                        or old['data'].get('campaign_id') != request.campaign_id\n                        or old['data']['arm'] != request.arm\n                        or old['data']['binding_sha256'] != digest(binding.model_dump(mode='json'))):\n                    raise Blocked('Scheduler trial identity conflicts with its pinned request')\n                return old\n"],[54,55,"              'registered_at':iso(self.clock()),'configuration_version':'0.3','fault_confirmed':False,'cleanup_verified':False}, entity_id=entity_id)\n"]]},
