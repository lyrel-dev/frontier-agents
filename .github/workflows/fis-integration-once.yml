name: Apply reviewed FIS integration once
on:
  push:
    branches: [feat/aws-fis-agent-benchmark]
    paths: [.github/workflows/fis-integration-once.yml]
permissions:
  contents: write
concurrency:
  group: fis-integration-once
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aws-fis-agent-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify transferred sources and apply exact reviewed integration edits
        run: |
          python - <<'PY'
