          "applications/aws-validation-console/agent_lab/static/app.js":{"before":"cc90e3deadb1ce1cb0cb51caa27d9de49ef7ac7566b1c5829ab45e77c2f015ff","after":"dc064b79a8f563c79ceba8bc5839c2e96b486d04ac1cab2890aa362f4be39629","edits":[[1,2,"const state={token:'',workspace:null,config:null,view:new URLSearchParams(location.search).has('trial')?'trials':'overview',selected:new URLSearchParams(location.search).get('trial'),detail:null,offline:location.protocol==='file:'};\n"]]},
          "applications/aws-validation-console/agent_lab/tests/browser_checks.py":{"before":"f90e2b9f29760e70b0375c52c5d21b4d4dccbc04c5d02ebca0f56766911604d7","after":"f6d697e12e2881942599ae4313d1549a7100b803ca6eadd4062aa4688f0d9d66","edits":[[44,45,"     page.goto(base+'/response',wait_until='networkidle')\n"]]}
          }''')
          expected={
          'build_aws_preview.py':'df335de6540047d886ef1f202c0bd90dc209201ee1aa2c8af150187dc0306bc4',
          'config/fis-accounts.template.json':'b38f0e76b2b116dc057a6d7f9429991bd8bf043e66b765076860aff3bac23ca3',
          'deploy/fis-discovery-policy.json':'192d502a6275eb5ccb734cd5491a87803cf240fd0d826ff53bdab7d82ac85f04',
          'docs/FIS_FLEET.md':'d8a855d4066f4da0c27796ef46c72d6cbafd8db35600ae9b4d04a7a46836cff0',
          'lab/fis_api.py':'e67a60939dbc1c0c0aff5363c6d69fbf81600415c8d6663d9fcea1409adbf3f9',
          'lab/fis_benchmark.py':'12bf4702a51162d4e14fd04706035165d2d5329872b4d8a7062f98265ca4bd2e',
          'lab/fis_campaigns.py':'3f95a70c8b232fb466b2d54d2f2fa1232f70709025e1e7d5b1dcdca3a0bd8ca3',
          'lab/fis_catalog.py':'adf37b1a4342d1c2cddadd9d3634ab361aff6d7bab264668dcc54ab391a1622e',
          'static/aws.css':'0d4b34d6414f4df62f0ae36435d55fde367b0ac82cb8781d1b0f3283158e71aa',
          'static/aws.html':'2964c7005136f777f79fe448fe1d01898b11ebc18052c0b88a2360ebf80e3ab0',
          'static/aws.js':'b2c51425f408a1adf284704d97335724f3b524acd6b39d23de0e5123402ba9d7',
          'tests/fis_browser_checks.py':'1ccf0a2db72b89d1941e5822a5b700c54545fc5528fdea0fc925eb0d19ae9cca',
          'tests/test_fis_fleet.py':'54b2cb5bd485a66acebeeb9fe6e6cd9af1af4137ef9745bceb58b7fe00a165aa'}
          root=Path('applications/aws-validation-console/agent_lab')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          for name,h in expected.items():
              assert sha((root/name).read_bytes())==h, 'Transferred source mismatch: '+name
          for name,p in patches.items():
              path=Path(name)
              assert name.startswith(str(root)+'/')
              raw=path.read_bytes()
              if sha(raw)==p['after']:continue
              assert sha(raw)==p['before'], 'Baseline mismatch: '+name
              lines=raw.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(p['edits']):lines[start:end]=replacement.splitlines(keepends=True)
              result=''.join(lines).encode()
              assert sha(result)==p['after'], 'Result mismatch: '+name
              path.write_bytes(result)
          print('Verified all new sources and all integration before/after hashes.')
          PY
      - name: Test exact integration without AWS
        working-directory: applications/aws-validation-console/agent_lab
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python build_assets.py
          python -m pytest -q
          node --check static/aws.js
          git diff --check
      - name: Commit only the reviewed application integration
        run: |
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith('applications/aws-validation-console/agent_lab/') for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fis-console): integrate AWS catalogue campaigns with guarded executor'
          git push origin HEAD:refs/heads/feat/aws-fis-agent-benchmark
