          "applications/aws-validation-console/agent_lab/lab/__init__.py":{"before":"da8024cbeacd4feb668a7b2e3606b41cd60e7b7c7715aa163b2c0e8ec9d05c46","after":"410221d12119ab10d591fe156106e0377f3545547ce6ab776160391f57f009b2","edits":[[1,2,"__version__ = '0.4.0-rc1'\n"]]},
          "applications/aws-validation-console/agent_lab/lab/api.py":{"before":"0809900f0cf200a035692f364936cf51786c8831149e5b441a53bc32300968ec","after":"74e64dea7161108415644dd42c48a62283307f6354f69956c39cb15efb1398b7","edits":[[15,15,"from .fis_campaigns import QueueRequest, AttachContract\n"],[78,79,"    def index(): return (ROOT/'static/aws.html').read_text()\n\n    @app.get('/response',response_class=HTMLResponse)\n    def response_console(): return (ROOT/'static/index.html').read_text()\n"],[82,83,"        allowed={'app.js':'text/javascript','charts.js':'text/javascript','style.css':'text/css','aws.js':'text/javascript','aws.css':'text/css'}\n"],[111,112,"        models={'experiment':Experiment,'configuration':Configuration,'diagnosis':Diagnosis,'campaign':CampaignRequest,'change':ChangeProposal,'fis_campaign':QueueRequest,'fis_contract':AttachContract}\n"],[179,179,"    from .fis_api import install\n    install(app, config, store, svc)\n"]]},
