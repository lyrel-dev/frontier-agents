          "applications/aws-validation-console/agent_lab/CHANGELOG.md":{"before":"8248974e4c7a5e3433123e5ebce36f1428547be40ba98795d776750d9cf4f236","after":"c6e7cc4415290b8fee8e6f99b0a81489eb3d0fb624f816f38cf7d735c9facc62","edits":[[0,0,"# 0.4.0-rc1 — AWS FIS account catalogue and benchmark campaigns\n\n- Added resumable, account-verified paginated template/history discovery with target-account configuration reads and explicit per-scope gaps.\n- Added an AWS-first default SPA: accounts, FIS library, guarded campaign queues and frozen response benchmarks.\n- Reused the existing FIS executor and per-exposure approval/recovery controls; no blanket execution of discovered templates.\n- Added deterministic child registration, transactional queue ownership/pause enforcement, failure retention and restart-safe progression.\n- Added cohort/agent-separated statistics, actual-exposure comparability, missing/censored counts, interactive graphs and all-attempt exports.\n- Multi-account and selector-based templates are visible but remain execution-blocked until their adapters are qualified.\n- No live AWS or agent outcome is asserted by this increment.\n\n"]]},
          "applications/aws-validation-console/agent_lab/README.md":{"before":"063d1c26bbdd4492f0b51e82d12eac50ab61e69ed5f3e9eb7db52d022e1fbcd6","after":"b00dd612c074c3e3df3b0f4582d0c99df03ba5f5612c7325c203dd0e95e97087","edits":[[0,1,"# AWS FIS account orchestration and agent benchmarks\n"],[2,3,"**0.4.0-rc1 — live AWS and agent-performance acceptance pending.**\n\nThe default `/` view discovers existing FIS templates across a configured set of AWS accounts and Regions, maps them to approved agent-response measurement contracts, and sequences qualified FIS trials through the durable executor. Frozen benchmarks retain unsuccessful and unstarted attempts and separate incomparable service/template/agent cohorts. The detailed response and prevention workspace remains at `/response`.\n\nStart with [the AWS/FIS operating guide](docs/FIS_FLEET.md). Account discovery needs only read permissions and is independent of execution configuration. No account, incident, experiment or measurement is preloaded.\n"]]},
          "applications/aws-validation-console/agent_lab/build_assets.py":{"before":"654ecf9eb268bc1b16ef0111520ebe25cec9aa5eb0a24d7fc13dd104481792e5","after":"b35d2ed64085f8dbd20014608d6850989dd6ba8d55526844eb1bf1fff9a8f6e6","edits":[[5,5,"from build_aws_preview import build as build_aws\nfrom lab.fis_campaigns import QueueRequest, AttachContract\n"],[13,14,"              'campaign': CampaignRequest, 'diagnosis': Diagnosis, 'change': ChangeProposal,\n              'fis_campaign': QueueRequest, 'fis_contract': AttachContract}\n"],[22,23,"    build_aws()\n    print('Built schemas, Grafana dashboard and empty response/AWS previews. No AWS access.')\n"]]},
