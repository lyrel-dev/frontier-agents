name: Accept AWS FIS console software
on:
  push:
    branches: [feat/aws-fis-agent-benchmark, feat/aws-fis-console-delivery, feat/aws-fis-console-acceptance]
    paths:
      - applications/aws-validation-console/agent_lab/**
      - .github/workflows/aws-fis-agent-benchmark.yml
  pull_request:
    paths:
      - applications/aws-validation-console/agent_lab/**
      - .github/workflows/aws-fis-agent-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fis-console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        working-directory: applications/aws-validation-console/agent_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source
        working-directory: .
        run: git archive --format=zip HEAD applications/aws-validation-console/agent_lab .github/workflows/aws-fis-agent-benchmark.yml > fis-console-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fis-console-source
          path: fis-console-source.zip
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        id: tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Clear previous generated evidence and build assets
        id: build
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          p=Path('validation');p.mkdir(exist_ok=True)
          for name in ['browser-review.json','fis-browser-review.json','setup-browser.json','worker-http-review.json','container-runtime.json','observability-acceptance.json','software-acceptance.json','fis-console-pytest.xml']:
              (p/name).unlink(missing_ok=True)
          (p/'current-run.json').write_text(json.dumps({'started_at_epoch':time.time()}))
          PY
          python build_assets.py
      - name: Python regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m pytest -q --junitxml=validation/fis-console-pytest.xml
      - name: Native response-console browser acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/browser_checks.py --native
      - name: Native FIS workspace browser acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/fis_browser_checks.py --native
      - name: Native guided-setup browser acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/setup_browser_checks.py --native
      - name: Durable-worker and actual HTTP acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/worker_http_acceptance.py
      - name: Verify actual container hosting and configuration persistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/container_runtime_acceptance.py
      - name: Verify real Prometheus scraping and Grafana PromQL execution
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/observability_acceptance.py
      - name: Record current-source software acceptance only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/summarize_acceptance.py
          git diff --check
      - name: Retain current-run evidence and generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fis-console-validation
          path: |
            applications/aws-validation-console/agent_lab/validation/
            applications/aws-validation-console/agent_lab/preview.html
            applications/aws-validation-console/agent_lab/aws-preview.html
            applications/aws-validation-console/agent_lab/setup-preview.html
            applications/aws-validation-console/agent_lab/grafana/
            applications/aws-validation-console/agent_lab/schemas/
          retention-days: 14
