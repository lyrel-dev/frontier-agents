name: Validate AWS FIS agent benchmark console
on:
  push:
    branches: [feat/aws-fis-agent-benchmark, feat/aws-fis-console-delivery]
    paths:
      - applications/aws-validation-console/agent_lab/**
      - .github/workflows/aws-fis-agent-benchmark.yml
  pull_request:
    paths:
      - applications/aws-validation-console/agent_lab/**
      - .github/workflows/aws-fis-agent-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fis-agent-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: applications/aws-validation-console/agent_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source
        working-directory: .
        run: git archive --format=zip HEAD applications/aws-validation-console/agent_lab .github/workflows/aws-fis-agent-benchmark.yml > fis-console-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fis-console-source
          path: fis-console-source.zip
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Test without AWS access
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python build_assets.py
          python -m pytest -q --junitxml=validation/fis-console-pytest.xml
          python tests/browser_checks.py --native
          python tests/fis_browser_checks.py --native
          python tests/native_setup_diagnostics.py
          python tests/worker_http_acceptance.py
          git diff --check
      - name: Verify isolated container hosting
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python tests/container_runtime_acceptance.py
      - name: Verify real Prometheus and Grafana integration
        run: python tests/observability_acceptance.py
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fis-console-validation
          path: |
            applications/aws-validation-console/agent_lab/validation/
            applications/aws-validation-console/agent_lab/preview.html
            applications/aws-validation-console/agent_lab/aws-preview.html
            applications/aws-validation-console/agent_lab/setup-preview.html
            applications/aws-validation-console/agent_lab/grafana/
            applications/aws-validation-console/agent_lab/schemas/
          retention-days: 14
