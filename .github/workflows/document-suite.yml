name: Build and validate engineering documentation
on:
  workflow_dispatch:
  push:
    branches: [main, 'docs/**']
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          if [ -f tools/docs/requirements.txt ]; then
            python -m pip install -r tools/docs/requirements.txt
          else
            python -m pip install -r tools/docs-requirements.txt
          fi
          python -m playwright install --with-deps chromium
      - name: Apply the plain-text editorial migration once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('revise_guide_text.py','revise_catalog_text.py','complete_knowledge_chapter.py','prepare_documentation_layout.py'):
              path=Path('tools')/name
              if path.exists():
                  text=re.sub(r"([A-Za-z]{3,})'(s|t|re|ve|ll|d|m)\b",r'\1’\2',path.read_text())
                  compile(text,str(path),'exec')
                  path.write_text(text)
          PY
          if [ -f tools/revise_guide_text.py ]; then python tools/revise_guide_text.py; fi
          if [ -f tools/revise_catalog_text.py ]; then python tools/revise_catalog_text.py; fi
          if [ -f tools/complete_knowledge_chapter.py ]; then python tools/complete_knowledge_chapter.py; fi
          if [ -f tools/prepare_documentation_layout.py ]; then python tools/prepare_documentation_layout.py; fi
      - name: Build guides, figures, catalog, and HTML presentations
        run: |
          python -m compileall -q tools/docs
          python tools/docs/build.py
      - name: Validate source relationships and rendered behavior
        run: python tools/docs/check.py --browser
      - name: Commit each documentation change separately
        env:
          DOCUMENTATION_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/docs/build.py --commit
          git push origin HEAD:"$DOCUMENTATION_BRANCH"
