name: Build and publish documentation suite
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-document-suite
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document and browser test tools
        run: |
          python -m pip install beautifulsoup4==4.13.4 python-pptx==1.0.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Assemble existing scenario and architecture documents
        run: |
          python tools/assemble_content.py
          python tools/build_suite.py
      - name: Build platform capability and mechanism references
        run: |
          python -m py_compile tools/build_platform_references.py tools/finalize_platform_publication.py
          python tools/build_platform_references.py --browser
      - name: Validate the final document collection
        run: |
          python tools/build_suite.py --check
          python tools/editorial_lint.py
          python tools/qa_format.py
          python tools/qa_mechanisms_browser.py
          python tools/validate_scope.py
          python tools/build_platform_references.py --check --browser
          python tools/finalize_platform_publication.py
      - name: Commit each changed document or deletion separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/build_platform_references.py --commit
          git push origin HEAD:main
