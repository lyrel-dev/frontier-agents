name: Build and validate engineering documentation
on:
  workflow_dispatch:
  push:
    branches: [main, 'docs/**']
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Graphviz with bounded network retries
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y graphviz
      - name: Install Python documentation dependencies
        timeout-minutes: 3
        run: python -m pip install --timeout 30 --retries 2 -r tools/docs/requirements.txt
      - name: Install Chromium for browser validation
        timeout-minutes: 3
        run: python -m playwright install chromium
      - name: Build guides, linked catalog, figures and HTML presentations
        run: |
          python -m compileall -q tools/docs
          python tools/docs/build.py
      - name: Check repeatable generation
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          def hashes():
              paths=[]
              for directory in ('guides','catalog','presentations','assets'):
                  paths.extend(p for p in Path(directory).rglob('*') if p.is_file())
              paths.extend(Path(p) for p in ('README.md','EDITORIAL_STANDARD.md','CHANGELOG.md','PUBLISHING.md'))
              return {p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          before=hashes()
          subprocess.run([sys.executable,'tools/docs/build.py'],check=True)
          after=hashes()
          assert before==after, 'Repeated generation changed document or figure bytes'
          revision=json.loads(Path('documentation-build.json').read_text())['revision']
          Path('qa/rebuild.json').write_text(json.dumps({'revision':revision,'files_compared':len(before),'identical_repeated_build':True,'boundary':'Same committed inputs and same runner environment; not cross-version reproducibility.'},indent=2)+'\n')
          PY
      - name: Validate relationships, examples and rendered behavior
        run: |
          if ! python tools/docs/check.py --browser > /tmp/document-check.log 2>&1; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('qa/checks.json')
          print(json.dumps(json.loads(p.read_text()).get('errors',[]),indent=2) if p.exists() else 'No validation record was produced')
          PY
            tail -n 20 /tmp/document-check.log
            exit 1
          fi
          python -c "import json; r=json.load(open('qa/checks.json')); print(json.dumps({'revision':r['revision'],'errors':r['errors'],'reading_structure':r.get('reading_structure',{})},indent=2))"
      - name: Commit each documentation change separately
        env:
          DOCUMENTATION_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/docs/build.py --commit
          git push origin HEAD:"$DOCUMENTATION_BRANCH"
