name: Build and validate engineering reference
on:
  workflow_dispatch:
  push:
    branches: [main, rebuild/product-reference]
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-reference-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document and browser tools
        run: |
          python -m pip install beautifulsoup4==4.13.4 python-pptx==1.0.2 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Apply one-time source replacement when present
        run: |
          if [ -f tools/prepare_rebuild.py ]; then python tools/prepare_rebuild.py; fi
      - name: Build the current references and presentations
        run: python tools/build_reference.py
      - name: Validate structure, arithmetic and browser behavior
        run: python tools/check_reference.py
      - name: Commit each changed document or deletion separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/build_reference.py --commit
          git push origin HEAD:${{ github.ref_name }}
      - name: Transfer working-branch outputs for rendered inspection
        if: always() && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: reference-validation-output
          retention-days: 1
          path: |
            reference/
            tools/
            devops/
            security/
            finops/
            presentations/
            qa/
            index.html
            comparison.html
            comparison.md
            README.md
            METHOD.md
            SCOPE.md
            VALIDATION.md
            MANIFEST.json
            documentation-build.json
          if-no-files-found: error
