name: Build and publish canonical engineering guides
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-document-suite
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation and browser dependencies
        run: |
          python -m pip install -r tools/docs-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compile sources and replace superseded documentation
        run: |
          python -m py_compile tools/docs_build.py tools/docs_check.py tools/lesson_plan.py
          python tools/docs_build.py
      - name: Validate canonical content, examples, browser controls and application preservation
        run: python tools/docs_check.py --browser
      - name: Commit each changed document or deletion separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/docs_build.py --commit
          git push origin HEAD:main
