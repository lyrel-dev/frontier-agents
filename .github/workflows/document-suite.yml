name: Build and validate engineering documentation
on:
  workflow_dispatch:
  push:
    branches: [main, 'docs/**']
    paths: [documentation-build.json]
permissions:
  contents: write
concurrency:
  group: frontier-documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          python -m pip install -r tools/docs/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Apply reviewed outcome consolidation once
        run: |
          if [ -f tools/docs/consolidate_once.py ]; then python tools/docs/consolidate_once.py; fi
      - name: Build guides, linked catalog, figures and HTML presentations
        run: |
          python -m compileall -q tools/docs
          python tools/docs/build.py
      - name: Check repeatable generation
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          def hashes():
              paths=[]
              for directory in ('guides','catalog','presentations','assets'):
                  paths.extend(p for p in Path(directory).rglob('*') if p.is_file())
              return {p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          before=hashes()
          subprocess.run([sys.executable,'tools/docs/build.py'],check=True)
          after=hashes()
          assert before==after, 'Repeated generation changed document or figure bytes'
          revision=json.loads(Path('documentation-build.json').read_text())['revision']
          Path('qa/rebuild.json').write_text(json.dumps({'revision':revision,'files_compared':len(before),'identical_repeated_build':True,'boundary':'Same committed inputs and same runner environment; not cross-version reproducibility.'},indent=2)+'\n')
          PY
      - name: Validate relationships, examples and rendered behavior
        run: python tools/docs/check.py --browser
      - name: Commit each documentation change separately
        env:
          DOCUMENTATION_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/docs/build.py --commit
          git push origin HEAD:"$DOCUMENTATION_BRANCH"
